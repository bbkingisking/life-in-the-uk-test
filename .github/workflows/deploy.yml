name: Deploy to surge.sh

# Deploys on a tag push (a deliberate release) or when a PR into master is
# merged - not on every plain push to master, so routine commits (data
# fixes, refactors) don't each trigger a live deploy on their own.
on:
  push:
    tags:
      - '*'
  pull_request:
    types: [closed]
    branches: [master]

jobs:
  deploy:
    # pull_request fires on every close, merged or not - skip the ones
    # that were closed without merging (nothing to deploy).
    if: github.event_name == 'push' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      # For a merged PR, check out master's actual tip rather than
      # actions/checkout's default for pull_request events (the PR's
      # synthetic pre-merge preview ref, which can go stale the moment the
      # PR closes). For a tag push, github.ref already points at the tag.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && 'master' || github.ref }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Regenerates dist/island-walk-pools.json (the data behind "Island
      # walk" mode - see docs/KNOWLEDGE-WALK-DESIGN.md) fresh on every
      # deploy, so it never drifts from dist/knowledge-map.html. Non-zero
      # exit (an island falling short of its target walk count) fails this
      # step, which skips every step after it - the site is never deployed
      # with a broken or thin pool.
      - name: Generate Island walk pools
        run: go run ./cmd/liuk leanwalk dist/island-walk-pools.json

      # Stamps the footer with the commit actually being deployed, so
      # "Build <hash>" reflects real build provenance.
      - name: Embed build hash
        run: sed -i "s/__GIT_SHA__/$(git rev-parse --short HEAD)/" dist/index.html

      # Official surge CLI via npx - no third-party Action, no
      # package.json/lockfile needed for a one-command deploy. --project
      # dist deploys only the site itself, not the Go tool's own source
      # (cmd/, internal/, go.mod) or repo-only docs (README.md, docs/).
      - name: Deploy to surge.sh
        env:
          SURGE_LOGIN: ${{ secrets.SURGE_LOGIN }}
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}
        run: npx --yes surge --project dist --domain life-in-the-uk.surge.sh
