erence": "Women were given the right to vote at the age of 21, the same as men.", "category": "history", "answers": ["Women were given the right to vote at the age of 18, the same as men.", "Women were given the right to vote at the age of 25.", "Women were given the right to vote at the age of 30.", "Women were given the right to vote at the age of 21, the same as men."], "correct": ["Women were given the right to vote at the age of 21, the same as men."]}, "36d11100ed": {"question": "What does Hogmanay refer to?", "reference": "In Scotland, the 31st of December (New Year’s Eve) is called Hogmanay.", "category": "religion-traditions", "answers": ["Christmas Day in Wales", "New Year's Eve in Scotland", "Christmas Day in Scotland", "New Year's Eve in Wales"], "correct": ["New Year's Eve in Scotland"]}, "be7624347b": {"question": "What is the capital city of Northern Ireland?", "reference": "The capital city of Northern Ireland is Belfast.", "category": "uk-geography", "answers": ["Cork", "Edinburgh", "Belfast", "Dublin"], "correct": ["Belfast"]}, "360854a6d6": {"question": "Which of the following wars took place between 1899 and 1902 in South Africa?", "reference": "The Boer War.", "category": "history", "answers": ["The Hundred Years War", "The Boer War", "The First World War", "The Crimean War"], "correct": ["The Boer War"]}, "9fb4565861": {"question": "Northern Ireland uses a system called ‘individual registration’ and all those entitled to vote must complete their own registration form.", "reference": "This statement is True.", "category": "government-law", "answers": ["True", "False"], "correct": ["True"]}, "5813a0e8bf": {"question": "Which two of the following policies are not controlled by the devolved administrations?", "reference": "Policy and laws governing defence, foreign affairs, immigration, taxation and social security all remain under central UK government control. However, many other public services, such as education, are controlled by the devolved administrations.", "category": "government-law", "answers": ["Health", "Education", "Defence", "Immigration"], "correct": ["Defence", "Immigration"]}, "b1c279341f": {"question": "How old do citizens of the UK, the Irish Republic or the Commonwealth have to be to stand for public office?", "reference": "Most citizens of the UK, the Irish republic or the Commonwealth aged 18 or over can stand for public office. There are some exceptions, including: members of the armed forces, civil servants and people found guilty of certain criminal offences.", "category": "government-law", "answers": ["18", "21", "16", "25"], "correct": ["18"]}, "d4eaddc6c8": {"question": "How did the Government promote policies of free trade during the Victorian Age?", "reference": "During Victorian times, the government began to promote policies of free trade, abolishing a number of taxes on imported goods. One example of this was the repealing of the Corn Laws in 1846. These had prevented the import of cheap grain. The reforms helped the development of the British industry, because raw materials could now be imported cheaply.", "category": "history", "answers": ["Abolishing a number of taxes on imported goods", "Abolishing the exportation of local produce", "Preventing the importation of cheap raw materials", "Preventing the importation of cheap grain"], "correct": ["Abolishing a number of taxes on imported goods"]}, "e6d606931c": {"question": "Who was Admiral Nelson?", "reference": "Admiral Nelson was in charge of the British fleet at the Battle of Trafalgar against the Spanish fleet and was killed in the battle.", "category": "history", "answers": ["One of the tribal leaders who fought against the Romans", "A British officer in charge of the British army at the Battle of Waterloo", "A British general who established the authority of the English Parliament", "A British officer in charge of the British fleet at the Battle of Trafalgar against the Spanish fleet"], "correct": ["A British officer in charge of the British fleet at the Battle of Trafalgar against the Spanish fleet"]}, "cd874dad61": {"question": "During the Middle Ages, who were the serfs?", "reference": "Serfs were peasants who had a small area of their lord’s land where they could grow food.", "category": "history", "answers": ["Peasants who had a small area of their lord’s agricultural land", "Soldiers who fought at the Battle of Trafalgar", "Noblemen who formed part of the king’s council of advisers", "A group of skilled people from Holland who came to England during the Middle Ages"], "correct": ["Peasants who had a small area of their lord’s agricultural land"]}, "fb3df8ce7e": {"question": "Which invention lead to the rapid development of the industry in Britain during the 18th and 19th centuries?", "reference": "The Industrial Revolution was the rapid development of industry in Britain in the 18th and 19th centuries. Britain was the first country to industrialise on a large scale. It happened because of the development of machinery and the use of steam power.", "category": "history", "answers": ["The Radar", "The Steam Power", "The Jet Engine", "The Turing Machine"], "correct": ["The Steam Power"]}, "641264916d": {"question": "MPs can only be contacted by post.", "reference": "You can contact MPs by letter or telephone at their constituency office, or at their office in the House of Commons. In addition, many MPs, Assembly members, MSPs and MEPs hold regular local ‘surgeries’, where constituents can go in person to talk about issues that are of concern to them.", "category": "government-law", "answers": ["True", "False"], "correct": ["False"]}, "ab9e126e07": {"question": "What movement challenged the authority of the Pope?", "reference": "The Reformation was a movement against the authority of the Pope and the ideas and practices of the Roman Catholic Church.", "category": "history", "answers": ["The Swinging Sixties", "The Reformation", "The Suffragettes", "The Enlightenment"], "correct": ["The Reformation"]}, "d74433811e": {"question": "What English King introduced the Domesday Book?", "reference": "William the Conqueror sent people all over England to draw up lists of all the towns and villages. The people who lived there, who owned the land and what animals they owned were also listed. This was called the Domesday Book.", "category": "history", "answers": ["King Henry V", "King Henry IV", "William the Conqueror", "Harold, the Saxon king of England"], "correct": ["William the Conqueror"]}, "3925d64df7": {"question": "What did ‘the Butler Act’  introduce in 1944?", "reference": "Richard Austen Butler became a Conservative MP in 1923 and held several positions before becoming responsible for education in 1941. In this role, he oversaw the introduction of the Education Act 1944 (often called ‘The Butler Act’), which introduced free secondary education in England and Wales.", "category": "history", "answers": ["Free primary education in England, Wales and Scotland", "Free university fees in England, Wales, Scotland and Northern Ireland", "Free primary and secondary education in England, Wales and Scotland", "Free secondary education in England and Wales"], "correct": ["Free secondary education in England and Wales"]}, "8685de8cd4": {"question": "What is the small claims procedure?", "reference": "The small claims procedure is an informal way of helping people to settle minor disputes without spending a lot of time and money using a lawyer.", "category": "government-law", "answers": ["An informal way of helping people to settle minor disputes without spending a lot of time and money using a lawyer", "A procedure that helps people to make small home insurance claims in certain circumstances"], "correct": ["An informal way of helping people to settle minor disputes without spending a lot of time and money using a lawyer"]}, "8ac338463e": {"question": "What building was constructed in Hyde Park to hold the Great Exhibition of 1851?", "reference": "In 1851, the Great Exhibition opened in Hyde Park in the Crystal Palace, a huge building made of steel and glass. Exhibits ranged from huge machines to handmade goods.", "category": "history", "answers": ["The Crystal Palace", "Buckingham Palace", "Kensington Palace", "Apsley House"], "correct": ["The Crystal Palace"]}, "358fac7cc1": {"question": "Who was Florence Nightingale?", "reference": "Florence Nightingale was a nurse. She is often regarded as the founder of modern nursing.", "category": "history", "answers": ["An economist", "A painter", "A nurse", "A poet"], "correct": ["A nurse"]}, "5a64d83813": {"question": "Who is the patron Saint of England?", "reference": "The patron Saint of England is St George.", "category": "religion-traditions", "answers": ["St George", "St Patrick", "St David", "St Andrew"], "correct": ["St George"]}, "74c861f3d9": {"question": "Where is Loch Lomond and the Trossachs National Park located?", "reference": "Loch Lomond and the Trossachs National Park is located in the west of Scotland.", "category": "uk-geography", "answers": ["England", "Wales", "Scotland", "Northern Ireland"], "correct": ["Scotland"]}, "9a93bb3d87": {"question": "What stories are associated with Geoffrey Chaucer?", "reference": "Geoffrey Chaucer wrote a series of poems in English about a group of people going to Canterbury on a pilgrimage.  This collection of poems is called The Canterbury Tales", "category": "history", "answers": ["The Cambridge Tales", "The Eastbourne Tales", "The Canterbury Tales", "The London Tales"], "correct": ["The Canterbury Tales"]}, "d3eb5679be": {"question": "When is Boxing Day celebrated?", "reference": "Boxing Day is the day after Christmas Day (26th December) and is a public holiday.", "category": "religion-traditions", "answers": ["31st October", "26th December", "24th December", "01st January"], "correct": ["26th December"]}, "0858f4eb1f": {"question": "What is the name of the holiday when banks and many other businesses are closed for the day?", "reference": "There are public holidays each year called bank holidays, when banks and many other businesses are closed for the day.", "category": "religion-traditions", "answers": ["Credit Holidays", "Branch Holidays", "Bank Holidays", "Business Holidays"], "correct": ["Bank Holidays"]}, "1821d6a44b": {"question": "Why were women given the right to vote?", "reference": "In 1918, women over the age of 30 were given voting rights and the right to stand for Parliament, partly in recognition of the contribution women made to the war effort during the First World War.", "category": "history", "answers": ["In recognition of the contribution women made to the war effort during the First World War", "In recognition of the contribution women made to the war effort during the Second World War", "In recognition of the contribution women made to the war effort during the Crimean War", "In recognition of the contribution women made to the war effort during the Civil War"], "correct": ["In recognition of the contribution women made to the war effort during the First World War"]}, "ba7ef316aa": {"question": "What do you need to drive in the UK?", "reference": "In the UK, you must have a driving licence to drive on public roads.", "category": "government-law", "answers": ["An ‘L’ plate", "A National Insurance Number", "A valid driving licence", "An ‘R’ plate"], "correct": ["A valid driving licence"]}, "0b6346371f": {"question": "Where does “the Fringe” festival take place?", "reference": "The Edinburgh Festival takes place in Edinburgh, Scotland, every summer. It is a series of different arts and cultural festivals, with the biggest and most well-known being the Edinburgh Festival Fringe (‘the Fringe’).", "category": "uk-geography", "answers": ["Fraserburgh", "Edinburgh", "Inverness", "St Andrews"], "correct": ["Edinburgh"]}, "bfe60f60eb": {"question": "How many members does the Welsh government have?", "reference": "There are 60 members of the Welsh government or members of the Senedd (MSs) and elections are held every four years using a form of proportional representation.", "category": "government-law", "answers": ["150", "120", "90", "60"], "correct": ["60"]}, "b330655101": {"question": "The names or photographs of  young people found guilty of a crime can be published in newspapers or used by the media.", "reference": "False. Members of the public are not allowed in Youth Courts, and the name or photographs of the accused young person cannot be published in newspapers or used by the media.", "category": "government-law", "answers": ["True", "False"], "correct": ["False"]}, "c1f3955614": {"question": "What was Edward Elgar famous for?", "reference": "Sir Edward Elgar (1857-1934) was a musician. His best known work is probably the Pomp and Circumstance Marches. March No1 (Land of Hope and Glory) is usually played at the Last Night of the Proms at the Royal Albert Hall.", "category": "arts-culture-sport", "answers": ["He was a musician", "He was a tennis player", "He was a comedian", "He was an actor"], "correct": ["He was a musician"]}, "061a177923": {"question": "Which of the following is not a British banknote?", "reference": "There are no £25 notes in the UK.", "category": "uk-geography", "answers": ["£50", "£25", "£20", "£5"], "correct": ["£25"]}, "93b23ccd7a": {"question": "Where does the Scottish Grand National take place?", "reference": "The Scottish Grand National takes place at Ayr.", "category": "uk-geography", "answers": ["Fife", "Edinburgh", "Ayr", "St Andrews"], "correct": ["Ayr"]}, "b68b84b65e": {"question": "The laws passed after the Glorious Revolution marked the beginning of the ______.", "reference": "The laws passed after the Glorious Revolution marked the beginning of the constitutional monarchy.", "category": "government-law", "answers": ["Constitutional monarchy", "Constitutional republic"], "correct": ["Constitutional monarchy"]}, "8f4b14b5dc": {"question": "During the reign of Elizabeth I, a large fleet of ships was sent to England to conquer the country and to restore Catholicism, where did this fleet come from?", "reference": "Elizabeth I became one of the most popular monarchs in English history, particularly after 1588, when the English defeated the Spanish Armada (a large fleet of ships), which had been sent by Spain to conquer England and restore Catholicism.", "category": "history", "answers": ["France", "Portugal", "Spain", "Italy"], "correct": ["Spain"]}, "42bc481421": {"question": "What did the Habeas Corpus Act introduce?", "reference": "The Habeas Corpus Act became law in 1679. This was a very important piece of legislation which remains relevant today. Habeas corpus is Latin for ‘you must present the person in court’. The Act guaranteed that no one could be held prisoner unlawfully. Every prisoner has a right to a court hearing.", "category": "history", "answers": ["That every prisoner has a right to a court hearing", "A salary for members of Parliament (MPs)", "Financial help for the unemployed, old-age pensions and free school meals", "Measures to improve the conditions of workers"], "correct": ["That every prisoner has a right to a court hearing"]}, "ef05181577": {"question": "What did Emmeline Pankhurst fight for?", "reference": "Emmeline Pankhurst she set up the women’s Franchise League in 1889, which fought to get the vote in local elections for married women. In 1903 she helped found the Women’s Social and Political Union (WSPU). This was the first group whose members were called ‘suffragettes’. The group used civil disobedience as part of their protest to gain the vote for women. In 1918, women over the age of 30 were given voting rights and the right to stand for Parliament, partly in recognition of the contribution women made to the war effort during the First World War.", "category": "history", "answers": ["The right to liberty and security", "The right for women to vote", "Freedom of expression", "The right to a fair trial"], "correct": ["The right for women to vote"]}, "3bafd2ad77": {"question": "What is “the Proms”?", "reference": "The Proms is an eight-week summer season of orchestral classical music that takes place in various venues, including the Royal Albert Hall in London.", "category": "arts-culture-sport", "answers": ["An annual event that gives awards in a range of categories, such as best British group and best British solo artist", "An annual cultural festival which includes music, dance, art and original performances largely in Welsh", "An eight-week summer season of daily orchestral classical music concerts", "Light-hearted plays with music and comedy"], "correct": ["An eight-week summer season of daily orchestral classical music concerts"]}, "10aff5ec69": {"question": "What was Isaac Newton known for?", "reference": "Newton’s most famous published work was Philosophiae Naturalis Principia Mathematica (‘Mathematical Principle of Natural Philosophy’), which showed how gravity applied to the whole universe.", "category": "arts-culture-sport", "answers": ["The discovery of insulin", "The discovery of gravity", "The discovery of penicillin", "The discovery of steam power"], "correct": ["The discovery of gravity"]}, "b85bf8ff5c": {"question": "When did the WWI come to an end?", "reference": "The World War I ended in 1918.", "category": "history", "answers": ["In 1922", "In 1918", "In 1945", "In 1943"], "correct": ["In 1918"]}, "147319bb3e": {"question": "Who built a wall in the north of England to keep out the Picts (ancestors of the Scottish people)?", "reference": "The Emperor Hadrian built a wall in the north of England to keep out the Picts (ancestors of the Scottish people).", "category": "history", "answers": ["Boudicca", "Emperor Hadrian", "Emperor Claudius", "Julius Caesar"], "correct": ["Emperor Hadrian"]}, "ecc6b3a745": {"question": "Which two universities participate in an annual rowing race that takes place on the River Thames?", "reference": "Rowing is also popular, both as a leisure activity and as a competitive sport. There is a popular yearly race on the Thames between Oxford and Cambridge Universities.", "category": "arts-culture-sport", "answers": ["The University of Oxford", "The University of Cambridge", "The University of Manchester", "The University of Warwick"], "correct": ["The University of Oxford", "The University of Cambridge"]}, "a5ccddd484": {"question": "Does Britain have a written constitution?", "reference": "The British constitution is not written down in any single document, and therefore it is described as ‘unwritten’.", "category": "government-law", "answers": ["Yes", "No"], "correct": ["No"]}, "10ae46401e": {"question": "Is St Helena part of the UK?", "reference": "British overseas territories, such as St Helena and the Falkland Islands are linked to the UK but are not part of it.", "category": "uk-geography", "answers": ["Yes", "No"], "correct": ["No"]}, "15434abfc7": {"question": "Where is Theatreland?", "reference": "", "category": "uk-geography", "answers": ["Docklands", "London’s East End", "London’s West End", "London’s South End"], "correct": ["London’s West End"]}, "92513f601d": {"question": "What is the name of the UK currency?", "reference": "The currency in the UK is the pound sterling (symbol £).", "category": "uk-geography", "answers": ["Euro", "Pound Sterling", "Peso", "Dollar"], "correct": ["Pound Sterling"]}, "7167703a93": {"question": "What other name is given to Diwali?", "reference": "Diwali is often called the Festival of Lights.", "category": "religion-traditions", "answers": ["The Festival of Lights", "Ash Wednesday", "Good Friday", "Easter Monday"], "correct": ["The Festival of Lights"]}, "81338984af": {"question": "What is the Enlightenment?", "reference": "The Enlightenment was a period during the 18th century when new ideas about politics, philosophy and science were developed.", "category": "history", "answers": ["A period of total peace in England", "A period when new ideas about politics, philosophy and science were developed", "A period when England became the largest empire the world had ever seen", "A period of economic recovery after the Second World War"], "correct": ["A period when new ideas about politics, philosophy and science were developed"]}, "3e1a96a09d": {"question": "Which of the following charities helps the environment?", "reference": "Friends of the Earth is an environmental charity.", "category": "government-law", "answers": ["NSPCC", "Shelter", "Friends of the Earth", "Crisis"], "correct": ["Friends of the Earth"]}, "0ac03ac4c3": {"question": "Which of the following was a crucial aerial battle fought between Germany and Britain during WWII?", "reference": "The Battle of Britain.", "category": "history", "answers": ["The Battle of Britain", "The Battle of Worcester", "The Battle of Dunbar", "The Battle of Marston Moor"], "correct": ["The Battle of Britain"]}, "e5f8fc3d79": {"question": "What was Margaret Thatcher famous for?", "reference": "Margaret Thatcher was the first woman Prime Minister of the UK.", "category": "history", "answers": ["She fought for the right to vote for women", "She was the first woman Prime Minister of the UK", "She set up the women’s Franchise League", "She was the founder of modern nursing"], "correct": ["She was the first woman Prime Minister of the UK"]}, "c8ffc9e02a": {"question": "Which two languages combined to become one English language?", "reference": "After the Norman Conquest, the king and his noblemen had spoken Norman French and the peasants had continued to speak Anglo-Saxon. Gradually these two languages combined to become one English language.", "category": "history", "answers": ["Latin", "Anglo-Saxon", "Proto-Celtic", "Norman French"], "correct": ["Anglo-Saxon", "Norman French"]}, "6bd9cd19a8": {"question": "By law, radio and television coverage of the political parties must be balanced and so equal time has to be given to rival viewpoints.", "reference": "This statement is true.", "category": "government-law", "answers": ["True", "False"], "correct": ["True"]}, "0794dc72a4": {"question": "Where did the Spanish Armada come from?", "reference": "In 1588 the English defeated the Spanish Armada (a large fleet of ships), which had been sent by Spain to conquer England and restore Catholicism.", "category": "history", "answers": ["France", "Spain", "Italy", "South America"], "correct": ["Spain"]}, "2fc6e360ad": {"question": "What is the name of the War Memorial located in Whitehall?", "reference": "The Cenotaph is a war memorial located in Whitehall.", "category": "history", "answers": ["Dumfries", "Cenotaph", "Royal Crescent", "The White Tower"], "correct": ["Cenotaph"]}, "5e1eec4ee0": {"question": "The UK government has never suspended the Northern Ireland Assembly.", "reference": "False. The Northern Ireland Assembly has been suspended on a few occasions.", "category": "history", "answers": ["True", "False"], "correct": ["False"]}, "1d8cc13b27": {"question": "What kind of church did Scotland establish in 1560?", "reference": "In 1560, the predominantly Protestant Scottish Parliament abolished the authority of the Pope in Scotland and Roman Catholic religious services became illegal. A Protestant Church of Scotland with an elected leadership was established but, unlike in England, this was not a state Church.", "category": "religion-traditions", "answers": ["A Catholic church", "A Protestant church"], "correct": ["A Protestant church"]}, "56c001cb35": {"question": "When was the Domesday Book written?", "reference": "William the conqueror sent people all over England to draw up lists of all the towns and villages. The people who lived there, who owned the land and what animals they owned were also listed. This was called the Domesday Book, which gives a picture of society in England just after the Norman Conquest.", "category": "history", "answers": ["After the Viking invasion", "After the Norman conquest", "After the last Roman invasion", "After the Anglo-Saxon invasion"], "correct": ["After the Norman conquest"]}, "2524c24855": {"question": "The Northern Ireland Assembly cannot make decisions on which two of the following issues?", "reference": "The Northern Ireland Assembly can make decisions on issues such as: education, agriculture, the environment health and social services, but it cannot make decisions on immigration or defence issues.", "category": "history", "answers": ["Immigration", "Education", "Agriculture", "Defence"], "correct": ["Immigration", "Defence"]}, "5056381654": {"question": "What should you do to make a complaint about the police (choose two answers)?", "reference": "Anyone can make a complaint about the police by going to a police station and writing to the Chief Constable of the police force involved. Complaints can also be made to an independent body: the Independent Police Complaints Commission in England and Wales, the Police Complaints Commissioner for Scotland or the Police Ombudsman for Northern Ireland.", "category": "government-law", "answers": ["Write a complaint letter to the House of Commons", "Go to the Police station directly", "Write to the Chief Constable of the police force involved", "Write to your MP"], "correct": ["Go to the Police station directly", "Write to the Chief Constable of the police force involved"]}, "637826c4b5": {"question": "What flower did William Wordsworth write about?", "reference": "William Wordsworth wrote ‘The Daffodils’.", "category": "arts-culture-sport", "answers": ["Rose", "Daffodil", "Thistle", "Shamrock"], "correct": ["Daffodil"]}, "31afe7de04": {"question": "When is St Andrew’s day celebrated?", "reference": "St Andrew’s day, patron of Scotland, is celebrated on the 30th of November.", "category": "religion-traditions", "answers": ["17th April", "31st December", "1st March", "30th November"], "correct": ["30th November"]}, "1e46eae172": {"question": "Who was the architect that rebuilt Saint Paul’s cathedral after the Great Fire in 1666?", "reference": "In 1666, a great fire destroyed much of the city, including many churches and St Paul’s Cathedral. London was rebuilt with a new St Paul’s, which was designed by a famous architect, Sir Christopher Wren.", "category": "history", "answers": ["Robert Adam", "Sir Christopher Wren", "Sir Norman Foster", "Dame Zaha Hadid"], "correct": ["Sir Christopher Wren"]}, "19d4436a4c": {"question": "When were the first coins in Britain made?", "reference": "The people of the Iron Age made the first coins to be minted in Britain.", "category": "history", "answers": ["The Stone Age", "The Bronze Age", "The Iron Age", "The Middle Ages"], "correct": ["The Iron Age"]}, "38a81d6c51": {"question": "Who was Emmeline Pankhurst?", "reference": "Emmeline Pankhurst was born in Manchester in 1858. She set up the women’s Franchise League in 1889, which fought to get the vote in local elections for married women. In 1903 she helped found the Women’s Social and Political Union (WSPU). This was the first group whose members were called ‘suffragettes’.", "category": "history", "answers": ["A suffragette", "A nurse", "A doctor", "A scientist"], "correct": ["A suffragette"]}, "da197b3574": {"question": "Who did Britain fight against in the Crimean War?", "reference": "From 1853 to 1856, Britain fought with Turkey and France against Russia in the Crimean War.", "category": "history", "answers": ["Turkey", "Russia", "France", "Germany"], "correct": ["Russia"]}, "80602c8969": {"question": "How old do you have to be to buy alcohol in the UK?", "reference": "It is a criminal offence to sell alcohol to anyone who is under 18 or to buy alcohol for people who are under the age of 18. (There is one exception: people aged 16 or over can drink alcohol with a meal in a hotel or restaurant).", "category": "government-law", "answers": ["17", "18", "19", "20"], "correct": ["18"]}, "62de177158": {"question": "Which of the following is a Crown Dependency but not part of the UK?", "reference": "The Channel Islands and the Isle of Man are closely linked with the UK but are not part of it. They have their own governments and are called ‘Crown dependencies’.", "category": "uk-geography", "answers": ["Shetland", "Isle of Wight", "Isle of Man", "Anglesey"], "correct": ["Isle of Man"]}, "7dda5600ec": {"question": "Is the BBC controlled by the government?", "reference": "The BBC is the largest broadcaster in the world. It is the only wholly state-funded media organisation that is independent of government.", "category": "government-law", "answers": ["Yes", "No"], "correct": ["No"]}, "8ff93aefe1": {"question": "How many members does the Northern Ireland Assembly have?", "reference": "The Northern Ireland Assembly has 90 elected members, known as MLAs (members of the Legislative Assembly).", "category": "history", "answers": ["12", "60", "90", "108"], "correct": ["90"]}, "63d94b864e": {"question": "Who was in charge of the British fleet at the Battle of Trafalgar?", "reference": "Admiral Nelson was in charge of the British fleet at Trafalgar and was killed in the battle.", "category": "history", "answers": ["Oliver Cromwell", "The Duke of Wellington", "Robert the Bruce", "Admiral Nelson"], "correct": ["Admiral Nelson"]}, "82e5019faf": {"question": "What was inscribed in the first coins to be minted in Britain during the Iron Age?", "reference": "The people of the Iron Age made the first coins to be minted in Britain, some inscribed with the names of Iron Age kings.", "category": "history", "answers": ["The names of Iron Age kings", "The names of Iron Age Gods", "The names of trees", "The names of animals"], "correct": ["The names of Iron Age kings"]}, "a746bbbf5a": {"question": "Towns, cities and rural areas in the UK are governed by government appointed officials.", "reference": "Towns, cities and rural areas in the UK are governed by democratically elected councils, often called ‘local authorities’.", "category": "government-law", "answers": ["True", "False"], "correct": ["False"]}, "ee4b1860ea": {"question": "Where is the Tate Art Gallery located?", "reference": "The Tate Britain and Tate Modern are in London.", "category": "uk-geography", "answers": ["Glasgow", "Cardiff", "London", "Belfast"], "correct": ["London"]}, "d09e8e464d": {"question": "The version of the Bible created by King James I is known as:", "reference": "One achievement of King James’ reign was a new translation of the Bible into English. This translation is known as the ‘King James Version’ or the ‘Authorised Version’.", "category": "religion-traditions", "answers": ["Authorised version", "Reformed version", "Approved version", "Unique version"], "correct": ["Authorised version"]}, "3cbb2e1f0d": {"question": "What is the period of the 1960s known for?", "reference": "", "category": "history", "answers": ["A downgrade in manufacturing", "A growth in British fashion and pop music", "A shortage of water", "A blockage of social laws"], "correct": ["A growth in British fashion and pop music"]}, "976d5e9338": {"question": "Between 1680 and 1720 many refugees called Huguenots came to England, which country did they come from?", "reference": "Between 1680 and 1720 many refugees called Huguenots came from France.", "category": "history", "answers": ["Pakistan", "Germany", "India", "France"], "correct": ["France"]}, "d2c8c3c43d": {"question": "What is the most famous tennis tournament played in the UK?", "reference": "The most famous tournament hosted in Britain is The Wimbledon Championships, which takes place each year at the All England Lawn Tennis and Croquet Club.", "category": "arts-culture-sport", "answers": ["The Queen's Club Championships", "Wimbledon", "Roland Garros", "The Aegon Championships"], "correct": ["Wimbledon"]}, "bebb8b1681": {"question": "MPs can only be contacted at their office in the House of Commons.", "reference": "You can contact MPs by letter or telephone at their constituency office, or at their office in the House of Commons. In addition, many MPs, Assembly members, MSPs and MEPs hold regular local ‘surgeries’, where constituents can go in person to talk about issues that are of concern to them.", "category": "government-law", "answers": ["True", "False"], "correct": ["False"]}, "2333d3c683": {"question": "What is the day when jokes are published in newspapers and telecasted on TV?", "reference": "April Fool’s Day, 1 April, is a day when people play jokes on each other until midday. The television and newspapers often have stories that are April Fool jokes.", "category": "religion-traditions", "answers": ["April Fool’s Day", "Boxing Day", "Halloween", "Valentine’s Day"], "correct": ["April Fool’s Day"]}, "b086ad41c5": {"question": "Which Scottish king defeated the English at the Battle of Bannockburn?", "reference": "In 1314 the Scottish, led by Robert the Bruce, defeated the English at the Battle of Bannockburn, and Scotland remained unconquered by the English.", "category": "history", "answers": ["King Charles I", "King James I", "Admiral Nelson", "Robert the Bruce"], "correct": ["Robert the Bruce"]}, "1fc8d5c2e2": {"question": "Who invented the World Wide Web?", "reference": "The inventor of the World Wide Web was Sir Tim Berners-Lee.", "category": "arts-culture-sport", "answers": ["Sir Tim Berners-Lee", "Sir Peter Mansfield", "Sir Ian Wilmot", "Sir Robert Edwards"], "correct": ["Sir Tim Berners-Lee"]}, "5924e69f89": {"question": "How are civil servants appointed and what political party do they belong to?", "reference": "Civil servants are chosen on merit and are politically neutral – they are not political appointees.", "category": "government-law", "answers": ["They are chosen on merit and form part of the Liberal Democrats party", "They are chosen randomly and form part of the Conservative party", "They are chosen randomly and are politically neutral", "They are chosen on merit and are politically neutral"], "correct": ["They are chosen on merit and are politically neutral"]}, "b7cc9be237": {"question": "What is known as the “Dunkirk spirit”?", "reference": "During WWII as France fell, the British decided to evacuate British and French soldiers from France in a huge naval operation. Many civilian volunteers in small pleasure and fishing boats from Britain helped the Navy to rescue more than 300,000 men from the beaches around Dunkirk.", "category": "history", "answers": ["When the German air force bombed London and other British cities at night-time", "The evacuation of Allied soldiers from France during World War II", "When new social classes appeared after the Black Death", "The period when many refugees called Huguenots came from France"], "correct": ["The evacuation of Allied soldiers from France during World War II"]}, "9d6f3ebf70": {"question": "You have to be at least 21 years old to serve on a jury.", "reference": "Anyone who is on the electoral register and is aged 18 to 70 can serve on a jury.", "category": "government-law", "answers": ["True", "False"], "correct": ["False"]}, "13467fcfde": {"question": "If you wish to be a permanent resident or citizen of the UK, you should (choose TWO answers):", "reference": "If you wish to be a permanent resident or citizen of the UK, you should: respect the rights of others, including their right to their own opinions, look after yourself and your family, respect and obey the law, treat others with fairness and look after the area in which you live and the environment.", "category": "values-principles", "answers": ["Respect the rights of others, including their right to their own opinions", "Buy a house in the UK", "Look after yourself and your family", "Marry a British citizen"], "correct": ["Respect the rights of others, including their right to their own opinions", "Look after yourself and your family"]}, "e0502897a8": {"question": "Which of the following major sports event took place in the UK in 2012?", "reference": "The UK has hosted the Olympic games on three occasions: 1908, 1948 and 2012.", "category": "arts-culture-sport", "answers": ["The Football World Cup", "The Rugby World Cup", "The Olympic games", "The Eurocup Basketball"], "correct": ["The Olympic games"]}, "60565a5e8c": {"question": "Charles I believed in the ‘Divine Right of Kings’ so he tried:", "reference": "Charles I believed in the ‘Divine Right of Kings’: the idea that the king was directly appointed by God to rule. He thought that the king should be able to act without having to seek approval from Parliament and he tried to rule without the Parliament at all.", "category": "history", "answers": ["To rule without the Parliament", "To rule with the approval of the Parliament", "To raise money for the Parliament", "To restore Catholicism in Britain"], "correct": ["To rule without the Parliament"]}, "9f052389af": {"question": "What is the Union Jack?", "reference": "The Union Flag is also known as the Union Jack.", "category": "uk-geography", "answers": ["The Flag of the Commonwealth", "The Flag of the United Kingdom", "The shield used by British Knights", "A trade union to protect workers rights"], "correct": ["The Flag of the United Kingdom"]}, "77db103785": {"question": "When is St George’s day?", "reference": "St George’s day, patron of England is celebrated on the 23rd of April.", "category": "religion-traditions", "answers": ["17th March", "30th November", "1st March", "23rd April"], "correct": ["23rd April"]}, "79d65674de": {"question": "Which is the largest National Park in England?", "reference": "The Lake District is England’s largest national park.", "category": "uk-geography", "answers": ["Snowdonia", "Loch Lomond and the Trossachs National Park", "The Giant’s Causeway", "The Lake District"], "correct": ["The Lake District"]}, "6d2af1e294": {"question": "Boudicca, was a tribal leader who fought against which foreign invaders?", "reference": "One of the tribal leaders who fought against the Romans was Boudicca, the queen of the Iceni.", "category": "history", "answers": ["The Normands", "The Vikings", "The Anglo-Saxons", "The Romans"], "correct": ["The Romans"]}, "50cf8f544f": {"question": "Which of the following poems is about a group of people going on a pilgrimage?", "reference": "Geoffrey Chaucer wrote a series of poems in English about a group of people going to Canterbury on a pilgrimage. The people decided to tell each other stories on the journey, and the poems describe the travellers and some of the stories they told. This collection of poems is called The Canterbury Tales.", "category": "history", "answers": ["The Canterbury Tales", "All the world’s a stage", "A Midsummer Night’s dream", "Great Expectations"], "correct": ["The Canterbury Tales"]}, "73f44db40a": {"question": "How are public holidays called?", "reference": "There are public holidays each year called bank holidays, when banks and many other businesses are closed for the day.", "category": "religion-traditions", "answers": ["Bank Holidays", "Workers Holidays", "Business Holidays", "Summer Holidays"], "correct": ["Bank Holidays"]}, "3189c5a86c": {"question": "How did Charles II manage to escape to Europe after his defeat in the Civil War?", "reference": "Charles II escaped from Worcester, famously hiding in an oak tree on one occasion, and eventually fled to Europe.", "category": "history", "answers": ["Hiding in a farmer's house", "Riding a horse", "Hiding in an oak tree", "Swimming"], "correct": ["Hiding in an oak tree"]}, "7ecdf7dd0c": {"question": "Who defeated the Vikings?", "reference": "The Anglo-Saxon kingdoms in England united under King Alfred the Great, who defeated the Vikings.", "category": "history", "answers": ["Harold", "Edward I of England", "King Arthur", "King Alfred the Great"], "correct": ["King Alfred the Great"]}, "a8883ea342": {"question": "Who was William Caxton?", "reference": "William Caxton was the first person in England to print books using a printing press.", "category": "history", "answers": ["A poet who wrote about a group of people going to Canterbury on a pilgrimage", "The first person in England to print books using a printing press", "The first person to sail singlehanded around the world", "The inventor of the television"], "correct": ["The first person in England to print books using a printing press"]}, "ccf2975ba7": {"question": "Where do Beefeaters serve as tour guides?", "reference": "Beefeaters serve as tour guides at the Tower of London.", "category": "uk-geography", "answers": ["The Houses of the Parliament", "The Tower of London", "The O2", "The Big Ben"], "correct": ["The Tower of London"]}, "d19a3f707f": {"question": "During the rebellion of the clans in Scotland, Bonnie Prince Charlie was supported by clansmen from which Scottish region?", "reference": "Charles Edward Stuart (Bonnie Prince Charlie) was supported by clansmen from the Scottish highlands.", "category": "history", "answers": ["Glasgow", "Galloway", "Highlands", "Edinburgh"], "correct": ["Highlands"]}, "2c19ea759a": {"question": "What religion did Elizabeth I follow?", "reference": "Elizabeth the I was a protestant.", "category": "history", "answers": ["She was a Protestant", "She was a Catholic"], "correct": ["She was a Protestant"]}, "3ac73a0ffc": {"question": "Who became famous for his tramp character in silent movies?", "reference": "Charlie Chaplin became famous in silent movies for his tramp character.", "category": "arts-culture-sport", "answers": ["Sir Rex Harrison", "David Niven", "Richard Burton", "Charlie Chaplin"], "correct": ["Charlie Chaplin"]}, "9ea713e50c": {"question": "Which armed force was used in the Battle of Britain?", "reference": "The Royal Air Force.", "category": "history", "answers": ["The Royal Navy", "The Police Force", "The Naval Service", "The Royal Air Force"], "correct": ["The Royal Air Force"]}, "5e171f04ac": {"question": "In the UK, you have to be 21 years old to be able to vote in a general election.", "reference": "The present voting age of 18 was set in 1969 and (with a few exceptions) all UK-born and naturalised adult citizens have the right to vote.", "category": "history", "answers": ["True", "False"], "correct": ["False"]}, "e8313a78ac": {"question": "Which of the following poets was inspired by nature?", "reference": "British poets, including William Wordsworth, were inspired by nature.", "category": "arts-culture-sport", "answers": ["John Masefield", "Wilfred Owen", "Siegfried Sassoon", "William Wordsworth"], "correct": ["William Wordsworth"]}, "5a7416452a": {"question": "Against which country did Britain fight at the Battle of Waterloo?", "reference": "In 1815, the French Wars ended with the defeat of the Emperor Napoleon by the Duke of Wellington at the Battle of Waterloo.", "category": "history", "answers": ["Germany", "Italy", "France", "Spain"], "correct": ["France"]}, "a09f66db57": {"question": "Who was William Wilberforce?", "reference": "William Wilberforce, an evangelical Christian and a member of Parliament, also played an important part in changing the law. Along with other abolitionists (people who supported the abolition of slavery), he succeeded in turning public opinion against the slave trade.", "category": "history", "answers": ["A poet", "A sportsman", "A politician", "A musician"], "correct": ["A politician"]}, "4e8da2b668": {"question": "Who is the spiritual leader of the Church of England?", "reference": "The spiritual leader of the Church of England is the Archbishop of Canterbury.", "category": "religion-traditions", "answers": ["The Archbishop of Canterbury", "The Archbishop of London", "The Archbishop of Birmingham", "The Archbishop of Manchester"], "correct": ["The Archbishop of Canterbury"]}, "991e651958": {"question": "James I was King of which country before becoming King of England?", "reference": "When Elizabeth I died, her cousin James VI of Scotland became King James I of England, Wales and Ireland and Scotland remained a separate country.", "category": "history", "answers": ["Wales", "Ireland", "France", "Scotland"], "correct": ["Scotland"]}, "f837c87211": {"question": "Which country sent a fleet of ships to England in 1588?", "reference": "Elizabeth became one of the most popular monarchs in English history, particularly after 1588, when the English defeated the Spanish Armada (a large fleet of ships), which had been sent by Spain to conquer England and restore Catholicism.", "category": "history", "answers": ["France", "Germany", "Spain", "Italy"], "correct": ["Spain"]}, "def6485f28": {"question": "Where is the National Horseracing Museum located?", "reference": "There is a National Horseracing Museum in Newmarket, Suffolk.", "category": "uk-geography", "answers": ["Edinburgh, Scotland", "Newmarket, Suffolk", "St Andrews, Scotland", "Aintree near Liverpool"], "correct": ["Newmarket, Suffolk"]}, "2baf096eb5": {"question": "Which of the following castles is located in Scotland?", "reference": "Crathes Castle is located in Scotland.", "category": "uk-geography", "answers": ["Crathes Castle", "Caernarfon Castle", "Bodiam Castle", "Powis Castle"], "correct": ["Crathes Castle"]}, "b78a62e541": {"question": "Who was a famous Art Deco ceramic designer?", "reference": "Britain has produced many great designers, from Thomas Chippendale (who designed furniture in the 18th century) to Clarice Cliff (who designed Art Deco ceramics) to Sir Terence Conran (a 20th-century interior designer).", "category": "arts-culture-sport", "answers": ["Alexander McQueen", "Thomas Chippendale", "Clarice Cliff", "Mary Quant"], "correct": ["Clarice Cliff"]}, "052bc878f6": {"question": "When is St Patrick’s day celebrated?", "reference": "St Patrick’s day, patron of Northern Ireland is celebrated on the 17th of March.", "category": "religion-traditions", "answers": ["23rd April", "30th November", "1st April", "17th March"], "correct": ["17th March"]}, "b997c1a756": {"question": "How are the members of the Northern Ireland Parliament elected?", "reference": "The Northern Ireland Assembly has 108 elected members, known as MLAs (members of the Legislative Assembly). They are elected with a form of proportional representation.", "category": "government-law", "answers": ["By a system of proportional representation", "Using a system of ranked voting", "Using the first past the post system", "Using a runoff system"], "correct": ["By a system of proportional representation"]}, "1a52f42ae5": {"question": "Who was the first British Prime Minister?", "reference": "The most important minister in Parliament became known as the Prime Minister. The first man to be called this was Sir Robert Walpole, who was Prime Minister from 1721 to 1742.", "category": "government-law", "answers": ["Winston Churchill", "Earl of Wilmington", "Henry Pelham", "Sir Robert Walpole"], "correct": ["Sir Robert Walpole"]}, "48b191c212": {"question": "Which of the following actresses has not won an Oscar?", "reference": "British actors to have won Oscars include Colin Firth, Sir Antony Hopkins, Dame Judi Dench, Kate Winslet and Tilda Swinton. Emily Watson has not won an Oscar yet.", "category": "arts-culture-sport", "answers": ["Tilda Swinton", "Emily Watson", "Dame Judi Dench", "Kate Winslet"], "correct": ["Emily Watson"]}, "25b58a9ad4": {"question": "During the Enlightenment, Adam Smith developed ideas about:", "reference": "During ‘the Enlightenment’ Adam Smith developed ideas about economics which are still referred to today.", "category": "history", "answers": ["Physics", "Economics", "Science", "Engineering"], "correct": ["Economics"]}, "c178d053d1": {"question": "Who died at the Battle of Trafalgar?", "reference": "Admiral Nelson was in charge of the British fleet at Trafalgar and was killed in the battle.", "category": "history", "answers": ["Admiral Nelson", "Henry VIII", "Oliver Cromwell", "Napoleon"], "correct": ["Admiral Nelson"]}, "6ff81da45a": {"question": "When is Hogmanay celebrated?", "reference": "In Scotland, the 31st of December is called Hogmanay.", "category": "religion-traditions", "answers": ["25th of December", "2nd of January", "1st of January", "31st of December"], "correct": ["31st of December"]}, "950acb2f4a": {"question": "Proceedings in Parliament are broadcast on television and published in official reports known as:", "reference": "Proceedings in Parliament are broadcast on television and published in official reports called Hansard.", "category": "government-law", "answers": ["Canvassing", "Hansard", "Cabinets", "Domesday Book"], "correct": ["Hansard"]}, "3c485ffb5b": {"question": "Which of the following is a rugby competition?", "reference": "The most famous rugby union competition is the Six Nations Championship between England, Ireland, Scotland, Wales, France and Italy.", "category": "arts-culture-sport", "answers": ["The Scottish Grand National", "The Wimbledon Championships", "The Ashes", "The Six Nations Championship"], "correct": ["The Six Nations Championship"]}, "c3f2d7b9ec": {"question": "Who appoints life peers in the House of Lords?", "reference": "Life peers are appointed by the monarch on the advice of the Prime Minister.", "category": "government-law", "answers": ["The Speaker", "The Archbishop of Canterbury", "The Prime Minister", "The monarch"], "correct": ["The monarch"]}, "40e2930c5a": {"question": "Who mapped the coast of Australia?", "reference": "Captain James Cook mapped the coast of Australia and a few colonies were established there.", "category": "history", "answers": ["James Cook", "Admiral Nelson", "Isaac Newton", "Sake Dean Mahomet"], "correct": ["James Cook"]}, "439da55f20": {"question": "What was the first war to be extensively covered by the media?", "reference": "The Crimean War was the first war to be extensively covered by the media through news stories and photographs.", "category": "history", "answers": ["The Boer War", "The First World War", "The Second World War", "The Crimean War"], "correct": ["The Crimean War"]}, "0a60608099": {"question": "Which of the following monuments is located in Wiltshire?", "reference": "Stonehenge stands in what is now the English county of Wiltshire.", "category": "uk-geography", "answers": ["Hadrian’s Wall", "St Paul’s Cathedral", "Nelson’s Column", "Stonehenge"], "correct": ["Stonehenge"]}, "6125b57b41": {"question": "Who was the first Archbishop of Canterbury?", "reference": "St Augustine led missionaries from Rome, who spread Christianity in the south. St Augustine became the first Archbishop of Canterbury.", "category": "history", "answers": ["St Patrick", "St Augustine", "St Andrew", "St Columba"], "correct": ["St Augustine"]}, "368afac76b": {"question": "How old do you have to be to go into betting shops or gambling clubs?", "reference": "You have to be 18 to go into betting shops or gambling clubs.", "category": "government-law", "answers": ["18", "20", "16", "21"], "correct": ["18"]}, "c327c91017": {"question": "The system of government in the UK is a parliamentary democracy.", "reference": "This statement is true.", "category": "government-law", "answers": ["True", "False"], "correct": ["True"]}, "8c3451d73b": {"question": "What is the traditional food of Northern Ireland?", "reference": "Ulster fry is the correct answer.", "category": "religion-traditions", "answers": ["Haggis", "Pancakes", "Paella", "Ulster Fry"], "correct": ["Ulster Fry"]}, "a2f0283e87": {"question": "Who was elected as British Prime Minister in 1945?", "reference": "In 1945 the British people elected a Labour government. The new Prime Minister was Clement Attlee.", "category": "government-law", "answers": ["Clement Attlee", "Winston Churchill", "Harold Wilson", "Harold Macmillan"], "correct": ["Clement Attlee"]}, "ba0b8b1063": {"question": "How many times has the UK hosted the Olympic games?", "reference": "The UK has hosted the Olympic games on three occasions: 1908, 1948 and 2012.", "category": "arts-culture-sport", "answers": ["5", "3", "4", "8"], "correct": ["3"]}, "cfbd737841": {"question": "Why were canals built during the Industrial Revolution?", "reference": "Canals were built to link the factories to towns and cities and to the ports, particularly in the new industrial areas in the middle and north of England.", "category": "history", "answers": ["To link the factories to towns and cities and to the ports", "To make space for the large fleet of British ships", "To increase the number of water mills in the UK", "To increase the amount of water in towns and cities"], "correct": ["To link the factories to towns and cities and to the ports"]}, "01eeeebcfd": {"question": "Are civil servants appointed by the government?", "reference": "Civil servants are accountable to ministers. They are chosen on merit and are politically neutral – they are not political appointees.", "category": "government-law", "answers": ["Yes", "No"], "correct": ["No"]}, "c68288266f": {"question": "Which of the following countries helped Britain to develop the Concorde?", "reference": "Britain and France developed the world’s only supersonic commercial airliner, Concorde.", "category": "history", "answers": ["Germany", "Norway", "Italy", "France"], "correct": ["France"]}, "98308fd94c": {"question": "Which invention led to the development of Britain during the Industrial Revolution?", "reference": "The Industrial Revolution was the rapid development of industry in Britain in the 18th and 19th centuries. Britain was the first country to industrialise on a large scale. It happened because of the development of machinery and the use of steam power.", "category": "history", "answers": ["Magnetic Resonance Imaging", "Steam power", "Radar", "Hovercraft"], "correct": ["Steam power"]}, "6746c7e93e": {"question": "Which two languages were used across England during the Middle Ages?", "reference": "The Middle Ages saw the development of a national culture and identity. After the Norman Conquest, the king and his noblemen had spoken Norman French and the peasants had continued to speak Anglo-Saxon.", "category": "history", "answers": ["Welsh", "Gaelic", "Norman French", "Anglo-Saxon"], "correct": ["Norman French", "Anglo-Saxon"]}, "14f702c2fc": {"question": "In 1776, which British colonies declared their independence because they demanded that there should be ‘no taxation without representation’.", "reference": "In 1776, 13 American colonies declared their independence, stating that people had a right to establish their own governments.", "category": "history", "answers": ["North African", "Asian", "North American", "South African"], "correct": ["North American"]}, "7e49d85a8c": {"question": "When was England ruled by a republic and not by a monarch?", "reference": "When Charles I was executed, England declared itself a republic, called the Commonwealth. It no longer had a monarch.", "category": "government-law", "answers": ["When Elizabeth I died without any successor", "When Charles I was executed", "When the Carta Magna restricted the king’s power", "When kind Harold died after the Battle of Hastings"], "correct": ["When Charles I was executed"]}, "b6af3879b7": {"question": "Which film produced in the UK was one of the most commercially successful films of all time and one of the highest-grossing film franchises?", "reference": "Some of the most commercially successful films of all time, including the two highest-grossing film franchises (Harry Potter and James Bond), have been produced in the UK.", "category": "arts-culture-sport", "answers": ["Harry Potter", "Spider-man", "The Lord of the Rings", "Indiana Jones"], "correct": ["Harry Potter"]}, "02aecf1ba1": {"question": "When did the first farmers come to Britain?", "reference": "The first farmers arrived in Britain 6,000 years ago.", "category": "history", "answers": ["10,000 years ago", "6,000 years ago", "15,000 years ago", "2,000 years ago"], "correct": ["6,000 years ago"]}, "ed309cd447": {"question": "When did the First World War end?", "reference": "The First World War ended at 11.00 am on 11th November 1918 with victory for Britain and its allies.", "category": "history", "answers": ["At 12.00 pm on 11th November 1914", "At 12.00 pm on 11th November 1918", "At 11.00 am on 11th November 1914", "At 11.00 am on 11th November 1918"], "correct": ["At 11.00 am on 11th November 1918"]}, "6c3c217985": {"question": "Can court orders be obtained to protect a person from being forced into a marriage?", "reference": "Court orders can be obtained to protect a person from being forced into a marriage, or to protect a person in a forced marriage.", "category": "government-law", "answers": ["Yes", "No"], "correct": ["Yes"]}, "74e653a4b2": {"question": "What medal did Mary Peters win in the 1972 Olympics?", "reference": "Born in Manchester, Mary Peters moved to Northern Ireland as a child. She was a talented athlete who won an Olympic gold medal in the pentathlon in 1972.", "category": "arts-culture-sport", "answers": ["She did not win any medals", "Silver", "Gold", "Bronze"], "correct": ["Gold"]}, "6462435880": {"question": "In England, Wales and Northern Ireland Youth Court cases are normally heard by (choose TWO answers)?", "reference": "In England, Wales and Northern Ireland, if an accused person is aged 10 to 17, the case is normally heard in a Youth Court in front of up to three specially trained magistrates or a District Judge.", "category": "government-law", "answers": ["Up to 3 specially trained magistrates", "A District Judge", "A sheriff", "Up to 5 specially trained magistrates"], "correct": ["Up to 3 specially trained magistrates", "A District Judge"]}, "0bfced5c87": {"question": "What was invented by Alan Turing in the 1930s?", "reference": "A Turing machine is a theoretical mathematical device invented by Alan Turing (1912-54), a British mathematician, in the 1930s.", "category": "arts-culture-sport", "answers": ["The jet engine", "The television", "The Turing machine", "The ball pen"], "correct": ["The Turing machine"]}, "69b937119b": {"question": "Which of the following tells us about how people lived in England just after the Norman Conquest?", "reference": "William sent people all over England to draw up lists of all the towns and villages. The people who lived there, who owned the land and what animals they owned were also listed. This was called the Domesday Book. It still exists today and gives a picture of society in England just after the Norman Conquest.", "category": "history", "answers": ["The Domesday Book", "The Book of Common Prayer", "The Canterbury Tales", "The Carta Magna"], "correct": ["The Domesday Book"]}, "99bed556de": {"question": "Who led a team of scientists to ‘split the atom’ for the first time?", "reference": "Scientists led by Ernest Rutherford, working at Manchester and then Cambridge University, were the first to ‘split the atom’ and took part in the Manhattan Project in the United States, which developed the atomic bomb.", "category": "arts-culture-sport", "answers": ["Alexander Fleming", "Alan Turing", "Ernest Rutherford", "Sir Peter Mansfield"], "correct": ["Ernest Rutherford"]}, "dcc883078f": {"question": "What song is sung by people in the UK and other countries when they are celebrating the New Year?", "reference": "The song Auld Lang Syne, which is sung by people in the UK and other countries when they are celebrating the New Year (or Hogmanay as it is called in Scotland).", "category": "religion-traditions", "answers": ["Auld Lang Syne", "The British Anthem", "Jingle Bells", "White Christmas"], "correct": ["Auld Lang Syne"]}, "df0f4ba089": {"question": "Who fought in the English Civil war of 1642?", "reference": "The Civil war between the king and Parliament began in 1642. The country split into those who supported the king (the Cavaliers) and those who supported Parliament (the Roundheads).", "category": "history", "answers": ["The House of York and the House of Lancaster", "The Anglo-Saxons and the Vikings", "The Cavaliers and the Roundheads", "The House of Fraser and the House of Stuart"], "correct": ["The Cavaliers and the Roundheads"]}, "b4b902e42d": {"question": "Which two of these forts were part of Hadrian’s wall?", "reference": "Parts of Hadrian’s Wall, include the forts of Housesteads and Vindolanda.", "category": "history", "answers": ["Vindolanda", "Maiden Castle", "Housesteads", "Grimsby"], "correct": ["Vindolanda", "Housesteads"]}, "04aa8d087d": {"question": "What was the religion of the Puritans?", "reference": "The Puritans were a group of Protestants who advocated strict and simple religious doctrine and worship.", "category": "history", "answers": ["Hindu", "Catholic", "Sikh", "Protestant"], "correct": ["Protestant"]}, "14d7ffcee9": {"question": "What is the name of Irish people who favoured complete independence from the UK in the 19th century?", "reference": "The Irish Nationalist movement had grown strongly through the 19th century. Some, such as the Fenians, favoured complete independence.", "category": "history", "answers": ["Fenians", "Quakers", "Highlanders", "Suffragettes"], "correct": ["Fenians"]}, "1917dff151": {"question": "Which two British pop music groups were famous during the Swinging Sixties?", "reference": "The decade of the 1960s was a period of significant social change. It was known as the ‘swinging sixties’. There was growth in British fashion, cinema and popular music. Two well-known pop music groups at the time were The Beatles and The Rolling Stones.", "category": "history", "answers": ["The Rolling Stones", "The Beatles", "ABBA", "Radiohead"], "correct": ["The Rolling Stones", "The Beatles"]}, "34c3a9a9be": {"question": "What is the minimum age required to drive a motorcycle?", "reference": "In the UK, you must be at least 17 years to drive a car or motorcycle and you must have a driving licence to drive on public roads.", "category": "government-law", "answers": ["16 years old", "17 years old", "18 years old", "21 years old"], "correct": ["17 years old"]}, "3aeee7dac5": {"question": "The members of the House of Lords, known as peers, are elected by the people.", "reference": "The members of the House of Lords, known as peers, are not elected by the people.", "category": "government-law", "answers": ["True", "False"], "correct": ["False"]}, "dd2352fb17": {"question": "When did the Emancipation Act abolish slavery throughout the British Empire?", "reference": "In 1833 the Emancipation Act abolished slavery throughout the British Empire.", "category": "history", "answers": ["1835", "1823", "1807", "1833"], "correct": ["1833"]}, "ad4f5c4b1f": {"question": "Who is responsible for crime, policing and immigration?", "reference": "The Home Secretary is responsible for crime, policing and immigration.", "category": "government-law", "answers": ["The Chancellor of the Exchequer", "The Foreign Secretary", "The Speaker", "The Home Secretary"], "correct": ["The Home Secretary"]}, "a073939b5f": {"question": "What kind of genre was the film Wallace and Gromit created by Nick Park?", "reference": "Nick Park won four Oscars for his animated films, including three for films featuring Wallace and Gromit.", "category": "arts-culture-sport", "answers": ["A soap opera", "A silent movie", "An animated film", "An action film"], "correct": ["An animated film"]}, "77ca4858f1": {"question": "Anyone who is violent towards their partner – whether they are a man or a woman, married or living together – can be prosecuted.", "reference": "Anyone who is violent towards their partner – whether they are a man or a woman, married or living together – can be prosecuted.", "category": "government-law", "answers": ["True", "False"], "correct": ["True"]}, "bf53ec5b37": {"question": "When was the United Nations set up?", "reference": "The UN was set up after the Second World War and aims to prevent war and promote international peace and security.", "category": "history", "answers": ["After the First World War.", "After the Second World War.", "Before the First World War.", "Before the Second World War."], "correct": ["After the Second World War."]}, "bb697bc1c7": {"question": "Where is the Giant’s Causeway located?", "reference": "The Giant’s Causeway is a land formation of columns made from volcanic lava located on the north-east coast of Northern Ireland. It was formed about 50 million years ago. There are many legends about the Causeway and how it was formed.", "category": "uk-geography", "answers": ["Scotland", "England", "Wales", "Northern Ireland"], "correct": ["Northern Ireland"]}, "9c3b35e7d1": {"question": "What happened to Mary, Queen of Scots, after being sent to prison for 20 years by her cousin Queen Elizabeth I?", "reference": "Mary was executed, accused of plotting against Elizabeth I.", "category": "history", "answers": ["She got married.", "She was sent to France.", "She was executed.", "She was sent to Scotland."], "correct": ["She was executed."]}, "eaf5913d1d": {"question": "Which tribe came to Britain from northern Europe after the Romans left in AD 410?", "reference": "Britain was invaded by tribes from northern Europe: the Jutes, the Angles and the Saxons.", "category": "history", "answers": ["The Gepids", "The Jutes", "The Frisians", "The Burgundians"], "correct": ["The Jutes"]}, "01113877c5": {"question": "What is one of the highest-grossing film franchises produced in the UK?", "reference": "Some of the most commercially successful films of all time, including the two highest-grossing film franchises (Harry Potter and James Bond), have been produced in the UK.", "category": "arts-culture-sport", "answers": ["James Bond", "Star Wars", "The Lord of the Rings", "Superman"], "correct": ["James Bond"]}, "72d8182b52": {"question": "Who can hear cases in Youth Courts in England, Wales and Northern Ireland (two answers)?", "reference": "In England, Wales and Northern Ireland, if an accused person is aged 10 to 17, the case is normally heard in a Youth Court in front of up to three specially trained magistrates or a District Judge. The most serious cases will go the Crown Court. The parents or carers of the young person are expected to attend the hearing. Members of the public are not allowed in Youth Courts, and the name or photographs of the accused young person cannot be published in newspapers or used by the media.", "category": "government-law", "answers": ["Specially trained magistrates.", "Social workers.", "District judges.", "Members of the public."], "correct": ["Specially trained magistrates.", "District judges."]}, "4318743aeb": {"question": "Who came from the Netherlands to become the British monarch?", "reference": "In May 1660, Parliament invited Charles II to come back from exile in the Netherlands. He was crowned King Charles II of England, Wales, Scotland and Ireland.", "category": "government-law", "answers": ["William II", "Charles II", "Edward II", "George II"], "correct": ["Charles II"]}, "df55297373": {"question": "Who can apply for the National Citizen Service programme?", "reference": "The National Citizen Service programme gives 16- and 17-year-olds the opportunity to enjoy outdoor activities, develop their skills and take part in a community project.", "category": "government-law", "answers": ["14- and 15-year-olds", "15- and 16-year-olds", "16- and 17-year-olds", "17- and 18-year-olds"], "correct": ["16- and 17-year-olds"]}, "8dd23c6fed": {"question": "Nick Park has won four Oscars for his animated films, including three for films featuring:", "reference": "Nick Park, who has won four Oscars for his animated films, including three for films featuring Wallace and Gromit.", "category": "arts-culture-sport", "answers": ["Chariots of Fire", "Wallace and Gromit", "Four Weddings and a Funeral", "Women in Love"], "correct": ["Wallace and Gromit"]}, "26c144b30e": {"question": "Who was the British scientist who co-discovered the structure of the DNA molecule in the 1950s?", "reference": "The structure of the DNA molecule was discovered in 1953 through work at British universities in London and Cambridge. This discovery contributed to many scientific advances, particularly in medicine and fighting crime. Francis Crick (1916-2004), was one of those awarded the Nobel Prize for this discovery.", "category": "arts-culture-sport", "answers": ["Sir Ian Wilmot", "Keith Campbell", "James Watt", "Francis Crick"], "correct": ["Francis Crick"]}, "9c4ac96cd0": {"question": "What percentage of the UK population has a parent or grandparent born outside of the UK?", "reference": "Nearly 10% of the population has a parent or grandparent born outside the UK.", "category": "history", "answers": ["Around 5%", "Around 10%", "Around 15%", "Around 20%"], "correct": ["Around 10%"]}, "7606f942f3": {"question": "How old do you have to be to drive a moped in the UK?", "reference": "In the UK, you need to be at least 16 years old to ride a moped, and there are other age requirements and special tests for driving large vehicles.", "category": "government-law", "answers": ["15 years old", "16 years old", "17 years old", "18 years old"], "correct": ["16 years old"]}, "fc43a1d819": {"question": "Who was the leader of the Labour Party who introduced a Scottish Parliament and a Welsh Assembly?", "reference": "In 1997 the Labour Party led by Tony Blair was elected. The Blair government introduced a Scottish Parliament and a Welsh Assembly.", "category": "government-law", "answers": ["James Callaghan", "Clement Attlee", "Gordon Brown", "Tony Blair"], "correct": ["Tony Blair"]}, "76163feb69": {"question": "What is the maximum amount you can claim through the small claims procedure in Scotland and Northern Ireland?", "reference": "The small claims procedure is an informal way of helping people to settle minor disputes without spending a lot of time and money using a lawyer. This procedure is used for claims of less than £10,000 in England and Wales and £3,000 in Scotland and Northern Ireland.", "category": "government-law", "answers": ["£3,000", "£5,000", "£8,000", "£10,000"], "correct": ["£5,000"]}, "d163db4c4b": {"question": "Which historical monument did William the Conqueror build?", "reference": "The White Tower in the Tower of London is an example of a Norman castle keep, built on the orders of William the Conqueror.", "category": "history", "answers": ["St Paul’s Cathedral", "The Cenotaph", "Dumfries House", "The White Tower"], "correct": ["The White Tower"]}, "41a53d3c75": {"question": "Who became Prime Minister after Margaret Thatcher and played an important part in the Northern Ireland peace process?", "reference": "John Major was Prime Minister after Mrs Thatcher, and helped establish the Northern Ireland peace process.", "category": "history", "answers": ["James Callaghan", "John Major", "Tony Blair", "Harold Wilson"], "correct": ["John Major"]}, "c026f482eb": {"question": "Who should you contact to report a terrorist activity?", "reference": "If you think someone is trying to persuade you to join an extremist or terrorist cause, you should notify your local police force.", "category": "government-law", "answers": ["Your local Council.", "Your local MP.", "Your local police force.", "The Prime Minister."], "correct": ["Your local police force."]}, "3ad6a46449": {"question": "Which Paralympic athlete has won gold medals for swimming at the 2008, 2012 and 2016 Paralympic Games?", "reference": "Ellie Simmonds is a Paralympian who won gold medals for swimming at the 2008, 2012 and 2016 Paralympic Games and holds a number of world records. She was the youngest member of the British team at the 2008 Games.", "category": "arts-culture-sport", "answers": ["Sophie Christiansen", "Ellie Simmonds", "Baroness Tanni Grey-Thompson", "David Weir"], "correct": ["Ellie Simmonds"]}, "4e0e110554": {"question": "Each of the UK countries is associated with a flower symbol, which country is associated with the rose?", "reference": "The countries that make up the UK all have flowers which are particularly associated with them and which are sometimes worn on national saints’ days. The flowers associated to each country are as follows: England – the rose, Scotland – the thistle, Wales – the daffodil and Northern Ireland – the shamrock.", "category": "uk-geography", "answers": ["Wales", "Northern Ireland", "Scotland", "England"], "correct": ["England"]}, "6e9f9239ee": {"question": "Isambard Kingdom Brunel was responsible for:", "reference": "Brunel was originally from Portsmouth, England. He was an engineer who built tunnels, bridges, railway lines and ships. He was responsible for constructing the Great Western Railway, which was the first major railway built in Britain. It runs from Paddington Station in London to the south west of England, the West Midlands and Wales.", "category": "history", "answers": ["The construction of the Great Western Railway.", "The invention of the television.", "The construction of the Tower of London.", "The discovery of insulin."], "correct": ["The construction of the Great Western Railway."]}, "046a2459a8": {"question": "What is the Commonwealth?", "reference": "The Commonwealth is an association of countries that support each other and work together towards shared goals in democracy and development. Most member states were once part of the British Empire, although a few countries which were not have also joined.", "category": "history", "answers": ["An organization responsible for the protection and promotion of human rights in its member countries.", "A group of European and North American countries that have agreed to help each other if they come under attack.", "An association of countries that support each other and work together towards shared goals in democracy and development.", "An international organization that aims to prevent war and promote international peace and security."], "correct": ["An association of countries that support each other and work together towards shared goals in democracy and development."]}, "41d380c59b": {"question": "Under which name was the movement of opinion against the authority of the Pope during the times of Henry VIII known?", "reference": "The correct answer is the Reformation.", "category": "history", "answers": ["The Spanish Inquisition", "The Holy Wars", "The Reformation", "The Enlightenment"], "correct": ["The Reformation"]}, "9d09024e59": {"question": "What did Isaac Newton discover?", "reference": "Newton’s most famous published work was Philosophiae Naturalis Principia Mathematica (‘Mathematical Principle of Natural Philosophy’), which showed how gravity applied to the whole universe. Newton also discovered that white light is made up of the colours of the rainbow.", "category": "arts-culture-sport", "answers": ["Gravity", "Penicillin", "Insulin", "Lightbulb"], "correct": ["Gravity"]}, "8e6fb67f12": {"question": "What kind of movies did Academy Award winner Nick Park specialise in?", "reference": "Britain continues to be particularly strong in special effects and animation. One example is the work of Nick Park, who has won four Oscars for his animated films, including three for films featuring Wallace and Gromit.", "category": "arts-culture-sport", "answers": ["Action movies", "Animated movies", "Thrillers", "Horror movies"], "correct": ["Animated movies"]}, "a145482b57": {"question": "Which of the following is not a constitutional institution?", "reference": "Constitutional institutions in the UK include: the monarchy, the Parliament (the House of Commons and the House of Lords), the Prime Minister, the cabinet, the judiciary (courts), the police, the civil service and the local government. The armed forces are not a constitutional institution.", "category": "government-law", "answers": ["The Parliament", "The cabinet", "The armed forces", "The police"], "correct": ["The armed forces"]}, "ff34988529": {"question": "What food shortage caused the famine in Ireland?", "reference": "In the middle of the century the potato crop failed, and Ireland suffered a famine. A million people died from disease and starvation.", "category": "history", "answers": ["Corn", "Potato", "Wheat", "Oats"], "correct": ["Potato"]}, "47f66f5fc7": {"question": "The leader of the opposition appoints senior opposition MPs. They form a group whose role is to challenge the government and put forward alternative policies. What are they called?", "reference": "The leader of the opposition appoints senior opposition MPs to be ‘shadow ministers’. Their role is to challenge the government and put forward alternative policies. They form the shadow cabinet.", "category": "government-law", "answers": ["Shadow Cabinet", "Lobby groups", "Civil servants", "Support peers"], "correct": ["Shadow Cabinet"]}, "c8bef21059": {"question": "Which of the following are TWO responsibilities of the MPs?", "reference": "MPs responsibilities include: to represent everyone in their constituency, to help to create new laws, to scrutinise and comment on what the government is doing and to debate important national issues.", "category": "government-law", "answers": ["Protect life and property", "Represent everyone in their constituency", "Help to create new laws", "Scrutinise and comment on what the monarch is doing"], "correct": ["Represent everyone in their constituency", "Help to create new laws"]}, "c8fe7b6f77": {"question": "Who was the longest serving PM in the 20th century?", "reference": "Margaret Thatcher was the first woman Prime Minister of the UK. She was the longest-serving Prime Minister of the 20th century, remaining in office from 1979 until 1990.", "category": "history", "answers": ["John Major", "Sir Alec Douglas-Home", "Robert Walpole", "Margaret Thatcher"], "correct": ["Margaret Thatcher"]}, "2290cf731f": {"question": "What name is given to the territories which are linked to the UK but not part of it?", "reference": "There are several islands which are closely linked with the UK but are not part of it: the Channel Islands and the Isle of Man. These have their own governments and are called ‘Crown dependencies’.", "category": "uk-geography", "answers": ["Crown Dependencies", "Offshore Territories", "Crown Independencies", "British Colonies"], "correct": ["Crown Dependencies"]}, "74135c92c2": {"question": "What area did David Hume contribute to during the Enlightenment?", "reference": "David Hume was a famous philosopher who developed ideas about human nature during the 18th century and that have continued to influence philosophers over the years.", "category": "history", "answers": ["Architecture", "Poetry", "Cinema", "Philosophy"], "correct": ["Philosophy"]}, "a587192b66": {"question": "What proportion of the population died as a result of the Black Death in England?", "reference": "As a result of the Black Death, one third of the population of England died and a similar proportion in Scotland and Wales.", "category": "history", "answers": ["Half of the population", "One third of the population", "55% of the population", "One quarter of the population"], "correct": ["One third of the population"]}, "e6778c5734": {"question": "What happened to Charles I after he was in prison?", "reference": "Charles I’s army was defeated at the Battles of Marston Moor and Naseby. Charles was held prisoner by the parliamentary army. As he was unwilling to reach any agreement with the Parliament, in 1649 he was executed.", "category": "government-law", "answers": ["He moved to Spain", "He became a priest", "He escaped to France", "He was executed"], "correct": ["He was executed"]}, "998df672b6": {"question": "What are TWO responsibilities of the monarch?", "reference": "The monarch does not rule the country but appoints the government, which the people have chosen in a democratic election. The monarch also has regular meetings with the Prime Minister and can advise, warn and encourage, but the decisions on government policies are made by the Prime Minister and cabinet.", "category": "government-law", "answers": ["To appoint the members of the cabinet", "To advise, warn and encourage the Prime Minister\\'s decisions o
