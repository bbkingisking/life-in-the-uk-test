<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Knowledge Map — Life in the UK Test Exam Practice</title>
<style>
/* ===== Palette =====
   :root/dark blocks below are copied from style.css (same Everforest-
   derived tokens as the rest of the app) so this page reads as part of
   the same site without linking style.css's own header/main/footer tag
   rules, which assume the #app shell this page doesn't use. See
   style.css's own comment for the derivation. --type-* are this page's
   own addition: a categorical palette for the six entity types, chosen
   and validated with the data-viz skill's validator (six categories,
   adjacent-pair CVD Delta E >= 8.4 and normal-vision floor >= 19.3 in
   both modes - see scratchpad notes). Node identity is never color-alone
   regardless: every node carries a text label at read zoom, and hover/
   click always surface the type as a word in the tooltip/panel too. */
:root {
    color-scheme: light dark;
    --primary-color: #6c7b01;
    --on-primary: #fffbef;
    --on-primary-soft: rgba(255, 251, 239, 0.85);
    --secondary-color: #687566;
    --bg-color: #f4f0d9;
    --text-color: #5c6a72;
    --text-muted: #515b50;
    --card-bg: #fdf6e3;
    --border-color: #e0dcc7;
    --border-color-soft: #efebd4;
    --selected-bg: #e9efbe;
    --shadow-color: hsl(202 11% 40% / 10%);
    --border-radius: 8px;
    --spacing: 16px;
    --canvas-bg: #fcfcfb;
    --edge-color: 90, 90, 80;

    --type-person: #2a78d6;
    --type-place: #eb6834;
    --type-event: #1baf7a;
    --type-organization: #eda100;
    --type-work: #e87ba4;
    --type-group: #008300;
}

@media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
        --primary-color: #a7c080;
        --on-primary: #1e2326;
        --on-primary-soft: rgba(30, 35, 38, 0.85);
        --secondary-color: #bbc3be;
        --bg-color: #232a2e;
        --text-color: #d3c6aa;
        --text-muted: #cbd2cd;
        --card-bg: #343f44;
        --border-color: #475258;
        --border-color-soft: #3d484d;
        --selected-bg: rgba(167, 192, 128, 0.16);
        --shadow-color: rgba(0, 0, 0, 0.4);
        --canvas-bg: #1a1a19;
        --edge-color: 200, 200, 190;

        --type-person: #3987e5;
        --type-place: #d95926;
        --type-event: #199e70;
        --type-organization: #c98500;
        --type-work: #d55181;
        --type-group: #4caf4c;
    }
}
:root[data-theme="dark"] {
    --primary-color: #a7c080;
    --on-primary: #1e2326;
    --on-primary-soft: rgba(30, 35, 38, 0.85);
    --secondary-color: #bbc3be;
    --bg-color: #232a2e;
    --text-color: #d3c6aa;
    --text-muted: #cbd2cd;
    --card-bg: #343f44;
    --border-color: #475258;
    --border-color-soft: #3d484d;
    --selected-bg: rgba(167, 192, 128, 0.16);
    --shadow-color: rgba(0, 0, 0, 0.4);
    --canvas-bg: #1a1a19;
    --edge-color: 200, 200, 190;

    --type-person: #3987e5;
    --type-place: #d95926;
    --type-event: #199e70;
    --type-organization: #c98500;
    --type-work: #d55181;
    --type-group: #4caf4c;
}
:root[data-theme="dark"] { color-scheme: dark; }
:root[data-theme="light"] { color-scheme: light; }

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
    height: 100%;
    overscroll-behavior: none;
}

body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background-color: var(--bg-color);
    color: var(--text-color);
    line-height: 1.45;
    -webkit-tap-highlight-color: transparent;
    display: flex;
    flex-direction: column;
}

a { color: var(--primary-color); }

/* ---------------- top bar ---------------- */
.topbar {
    background-color: var(--primary-color);
    color: var(--on-primary);
    padding: 10px var(--spacing);
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
    z-index: 50;
}

.topbar-titles { display: flex; flex-direction: column; min-width: 0; }
.topbar h1 { font-size: 1.05rem; white-space: nowrap; }
.topbar .back-link {
    font-size: 0.72rem;
    color: var(--on-primary-soft);
    text-decoration: none;
}
.topbar .back-link:hover { text-decoration: underline; }

.topbar-stats {
    font-size: 0.72rem;
    color: var(--on-primary-soft);
    white-space: nowrap;
}

.search-wrap {
    position: relative;
    flex: 1;
    min-width: 140px;
    max-width: 360px;
}

#search-input {
    width: 100%;
    padding: 7px 10px;
    border-radius: 999px;
    border: 1px solid transparent;
    background: rgba(255,255,255,0.18);
    color: var(--on-primary);
    font-size: 0.85rem;
}
:root[data-theme="light"] #search-input,
:root:not([data-theme="dark"]) #search-input {
    background: rgba(0,0,0,0.12);
}
#search-input::placeholder { color: var(--on-primary-soft); }
#search-input:focus { outline: 2px solid var(--on-primary); background: var(--card-bg); color: var(--text-color); }

#search-results {
    position: absolute;
    top: calc(100% + 4px);
    left: 0;
    right: 0;
    background: var(--card-bg);
    border: 1px solid var(--border-color);
    border-radius: var(--border-radius);
    box-shadow: 0 6px 20px var(--shadow-color);
    max-height: 280px;
    overflow-y: auto;
    z-index: 60;
    color: var(--text-color);
}
#search-results:empty { display: none; }
.search-result {
    padding: 8px 12px;
    font-size: 0.85rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
}
.search-result:hover { background: var(--selected-bg); }
.search-result .swatch { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
.search-result .count { margin-left: auto; color: var(--text-muted); font-size: 0.75rem; }

.icon-btn {
    background: rgba(255,255,255,0.15);
    border: none;
    color: var(--on-primary);
    width: 34px;
    height: 34px;
    border-radius: 50%;
    font-size: 1rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
}
.icon-btn:hover { background: rgba(255,255,255,0.28); }

.sidebar-toggle { display: none; }

/* ---------------- layout ---------------- */
.layout {
    flex: 1;
    display: flex;
    min-height: 0;
}

.graph-pane {
    flex: 1;
    position: relative;
    background: var(--canvas-bg);
    min-width: 0;
}

#graph-canvas {
    display: block;
    width: 100%;
    height: 100%;
    cursor: grab;
    touch-action: none;
}
#graph-canvas.dragging { cursor: grabbing; }

.zoom-controls {
    position: absolute;
    bottom: 16px;
    left: 16px;
    display: flex;
    flex-direction: column;
    gap: 6px;
}
.zoom-controls button {
    width: 32px;
    height: 32px;
    border-radius: 6px;
    border: 1px solid var(--border-color);
    background: var(--card-bg);
    color: var(--text-color);
    font-size: 1rem;
    cursor: pointer;
}
.zoom-controls button:hover { border-color: var(--primary-color); }

.graph-hint {
    position: absolute;
    top: 12px;
    left: 16px;
    font-size: 0.72rem;
    color: var(--text-muted);
    background: color-mix(in srgb, var(--card-bg) 82%, transparent);
    padding: 5px 10px;
    border-radius: 999px;
    pointer-events: none;
}

#tooltip {
    position: absolute;
    pointer-events: none;
    background: var(--card-bg);
    border: 1px solid var(--border-color);
    border-radius: 6px;
    padding: 6px 10px;
    font-size: 0.78rem;
    box-shadow: 0 4px 14px var(--shadow-color);
    max-width: 220px;
    z-index: 40;
    display: none;
}
#tooltip .tt-label { font-weight: 700; }
#tooltip .tt-meta { color: var(--text-muted); font-size: 0.72rem; margin-top: 2px; }

/* ---------------- sidebar ---------------- */
.sidebar {
    width: 330px;
    flex-shrink: 0;
    background: var(--card-bg);
    border-left: 1px solid var(--border-color);
    display: flex;
    flex-direction: column;
    min-height: 0;
}

.sidebar-section {
    padding: 14px var(--spacing);
    border-bottom: 1px solid var(--border-color-soft);
}

.sidebar-section h2 {
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-muted);
    margin-bottom: 8px;
    font-weight: 700;
}

.legend-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 3px 0;
    cursor: pointer;
    user-select: none;
    font-size: 0.85rem;
}
.legend-row input { accent-color: var(--primary-color); }
.legend-swatch { width: 11px; height: 11px; border-radius: 50%; flex-shrink: 0; }
.legend-label { flex: 1; }
.legend-count { color: var(--text-muted); font-size: 0.75rem; }

.slider-row { display: flex; align-items: center; gap: 8px; font-size: 0.8rem; color: var(--text-muted); }
#min-mentions { flex: 1; accent-color: var(--primary-color); }
#min-mentions-val { width: 18px; text-align: right; color: var(--text-color); font-weight: 600; }

.sidebar-scroll {
    flex: 1;
    overflow-y: auto;
    min-height: 0;
}

.panel-empty {
    padding: 24px var(--spacing);
    font-size: 0.85rem;
    color: var(--text-muted);
}
.panel-empty p + p { margin-top: 10px; }

.detail-header { padding: 16px var(--spacing) 10px; }
.detail-type-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--text-muted);
    font-weight: 700;
    margin-bottom: 6px;
}
.detail-type-badge .legend-swatch { width: 9px; height: 9px; }
.detail-header h3 { font-size: 1.15rem; line-height: 1.25; }
.detail-count { font-size: 0.78rem; color: var(--text-muted); margin-top: 4px; }

.related-chip-wrap {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    padding: 0 var(--spacing) 14px;
}
.related-chip {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: var(--bg-color);
    border: 1px solid var(--border-color);
    border-radius: 999px;
    padding: 3px 10px 3px 6px;
    font-size: 0.76rem;
    cursor: pointer;
    color: var(--text-color);
}
.related-chip:hover { border-color: var(--primary-color); }
.related-chip .legend-swatch { width: 8px; height: 8px; }
.related-chip .w { color: var(--text-muted); }

.question-list { padding: 0 var(--spacing) 20px; display: flex; flex-direction: column; gap: 10px; }
.qcard {
    border: 1px solid var(--border-color);
    border-radius: var(--border-radius);
    padding: 10px 12px;
    background: var(--bg-color);
}
.qcard .qcat {
    display: inline-block;
    font-size: 0.65rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: var(--primary-color);
    margin-bottom: 4px;
}
.qcard .qtext { font-size: 0.88rem; font-weight: 600; margin-bottom: 4px; }
.qcard .qref { font-size: 0.8rem; color: var(--text-muted); }
.qcard .qref mark {
    background: var(--selected-bg);
    color: inherit;
    border-radius: 3px;
    padding: 0 2px;
}

.section-title-row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    padding: 14px var(--spacing) 6px;
}
.section-title-row h2 { margin-bottom: 0; }
.section-title-row .count-pill {
    font-size: 0.72rem;
    color: var(--text-muted);
}

.about-text {
    padding: 0 var(--spacing) 16px;
    font-size: 0.8rem;
    color: var(--text-muted);
}
.about-text p + p { margin-top: 8px; }

/* Base state - only the >760px column layout can see this: the sidebar
   sits inline, so it needs no close button. The media query below
   overrides it back to flex; it must stay declared BEFORE that block,
   since two same-specificity ".sidebar-close" rules resolve by source
   order, not by which one is inside the @media. */
.sidebar-close { display: none; }

@media (max-width: 760px) {
    .topbar h1 { font-size: 0.95rem; }
    .topbar-stats { display: none; }
    .sidebar-toggle { display: flex; }
    .sidebar {
        position: fixed;
        top: 0;
        right: 0;
        bottom: 0;
        width: min(86vw, 380px);
        transform: translateX(100%);
        transition: transform 0.2s ease;
        box-shadow: -8px 0 24px var(--shadow-color);
        z-index: 80;
    }
    .sidebar.open { transform: translateX(0); }
    .sidebar-close {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px var(--spacing);
        border-bottom: 1px solid var(--border-color-soft);
    }
    .sidebar-close button {
        background: none;
        border: none;
        font-size: 1.3rem;
        color: var(--text-color);
        cursor: pointer;
        line-height: 1;
    }
    .search-wrap { order: 10; flex-basis: 100%; max-width: none; }
}
</style>
</head>

ive and the environment", "To look after yourself and your family", "To stay in the UK forever", "To promote work in your local community"], "correct": ["To look after the area in which you live and the environment", "To look after yourself and your family"]}, "796f335e19": {"question": "Where is Big Ben located?", "reference": "Big Ben is the nickname for the great bell of the clock at the Houses of Parliament in London. Many people call the clock Big Ben as well. The clock is over 150 years old and is a popular tourist attraction. The clock tower is named ‘Elizabeth Tower’ in honour of Queen Elizabeth II’s Diamond Jubilee in 2012.", "category": "uk-geography", "answers": ["Buckingham Palace", "The Tower of London", "Trafalgar Square", "The Houses of the Parliament"], "correct": ["The Houses of the Parliament"]}, "0b430b9a6d": {"question": "When were men and women given the right to vote at the age of 21?", "reference": "In 1918, women over the age of 30 were given voting rights and the right to stand for Parliament, partly in recognition of the contribution women made to the war effort during the First World War. Shortly before Emmeline’s death in 1928, women were given the right to vote at the age of 21, the same as men.", "category": "history", "answers": ["1918", "1903", "1928", "1923"], "correct": ["1928"]}, "dfad587933": {"question": "Where is the UK geographically located?", "reference": "The UK is located in the north west of Europe.", "category": "uk-geography", "answers": ["South west of Europe", "North east of Europe", "North west of Europe", "South east of Europe"], "correct": ["North west of Europe"]}, "7c180b83c3": {"question": "Who is the patron Saint of Scotland?", "reference": "Patron Saints' days England, Scotland, Wales and Northern Ireland each have a national saint, called a patron saint. Each saint has a special day: 1 March: St David’s Day, Wales 17 March: St Patrick’s Day, Northern Ireland 23 April: St George’s Day, England 30 November: St Andrew’s Day, Scotland.", "category": "religion-traditions", "answers": ["St David", "St Patrick", "St George", "St Andrew"], "correct": ["St Andrew"]}, "158c54103b": {"question": "Which two houses fought in the Wars of the Roses?", "reference": "In 1455, a civil war was begun to decide who should be king of England. It was fought between the supporters of two families: the House of Lancaster and the House of York. This war was called the Wars of the Roses, because the symbol of Lancaster was a red rose and the symbol of York was a white rose. The war ended with the Battle of Bosworth Field in 1485. King Richard III of the House of York was killed in the battle and Henry Tudor, the leader of the House of Lancaster, became King Henry VII.", "category": "history", "answers": ["The House of Chester", "The House of York", "The House of Lancaster", "The House of Newcastle"], "correct": ["The House of York", "The House of Lancaster"]}, "335ba99b7a": {"question": "The Bill of Rights of 1689 confirmed the right to vote for all adult men.", "reference": "False. The Bill of Rights, 1689, confirmed the rights of Parliament and the limits of the king’s power. Parliament took control of who could be monarch and declared that the king or queen must be a Protestant", "category": "government-law", "answers": ["True", "False"], "correct": ["False"]}, "c65f40bb77": {"question": "What is the Cenotaph?", "reference": "The Cenotaph is a war memorial and it is the site of the annual Remembrance Day service attended by the Queen, politicians and foreign ambassadors.", "category": "history", "answers": ["A flower", "A Christian church", "A war memorial", "A theatre"], "correct": ["A war memorial"]}, "b863264da5": {"question": "Who was the first female Prime Minister of the UK?", "reference": "Margaret Thatcher was the first woman Prime Minister of the UK.", "category": "history", "answers": ["Mary Stuart", "Theresa May", "Margaret Thatcher", "Florence Nightingale"], "correct": ["Margaret Thatcher"]}, "f947e7c1b5": {"question": "Who chairs the debates at the House of Commons?", "reference": "Debates in the House of Commons are chaired by the Speaker.", "category": "government-law", "answers": ["A bishop", "The Prime Minister", "The Speaker", "The archbishop of Canterbury"], "correct": ["The Speaker"]}, "bff36ed913": {"question": "Who was the captain of the English football team that won the World Cup in 1966?", "reference": "Bobby Moore captained the English football team that won the World Cup in 1966.", "category": "arts-culture-sport", "answers": ["Sir Roger Bannister", "Sir Jackie Stewart", "Sir Ian Botham", "Bobby Moore"], "correct": ["Bobby Moore"]}, "4d1082f4d0": {"question": "When did the English defeat the Spanish Armada?", "reference": "In 1588 the English defeated the Spanish Armada.", "category": "history", "answers": ["1466", "1066", "1254", "1588"], "correct": ["1588"]}, "96418da069": {"question": "Anyone can make a complaint about the police by writing to the Chief Constable of the police force involved.", "reference": "If you are arrested and taken to a police station, a police Officer will tell you the reason for your arrest and you will be able to seek legal advice. If something goes wrong, the police complaints system tries to put it right. Anyone can make a complaint about the police by going to a police station or writing to the Chief Constable of the police force involved. Complaints can also be made to an independent body: the Independent Police Complaints Commission in England", "category": "government-law", "answers": ["True", "False"], "correct": ["True"]}, "7904d9f606": {"question": "What is the minimum age required to serve on a jury?", "reference": "Anyone who is on the electoral register and is aged 18 to 70 can be asked to serve on a jury.", "category": "government-law", "answers": ["16", "18", "21", "25"], "correct": ["18"]}, "1381ff57b4": {"question": "How is a jury selected?", "reference": "As well as getting the right to vote, people on the electoral register are randomly selected to serve on a jury. Anyone who is on the electoral register and is aged 18 to 70 can be asked to do this.", "category": "government-law", "answers": ["From the NHS registration system", "Randomly from the electoral register", "Alphabetically from the telephone directory", "From a postcode selection"], "correct": ["Randomly from the electoral register"]}, "b3181dac04": {"question": "What is a bank holiday?", "reference": "There are public holidays each year called bank holidays, when banks and many other", "category": "religion-traditions", "answers": ["A public holiday when banks are open all day", "A public holiday for people working in banks", "An additional day off that every worker in the UK is entitled to", "A public holiday when banks and many other businesses are closed for the day"], "correct": ["A public holiday when banks and many other businesses are closed for the day"]}, "f377019cf7": {"question": "What will you be given to vote before a general election takes place?", "reference": "Before the election you will be sent a poll card.", "category": "government-law", "answers": ["A poll tax relief", "A number to queue at the polling station", "A poll card", "An specific time for you to vote"], "correct": ["A poll card"]}, "be45e6d663": {"question": "Which of the following statements is correct?", "reference": "Solicitors’ charges are usually based on how much time they spend of a case.", "category": "government-law", "answers": ["Solicitors' charges are usually based on how much time they spend on a case", "Solicitors' charges are usually based on the nature of a case and its importance"], "correct": ["Solicitors' charges are usually based on how much time they spend on a case"]}, "57f4be4573": {"question": "By law, which TWO types of media have to give a balanced coverage of all political parties and equal time to rival viewpoints before an election?", "reference": "By law, radio and television coverage of the political parties must be balanced and so equal time has to be given to rival viewpoints.", "category": "government-law", "answers": ["Television", "Internet", "Newspapers", "Radio"], "correct": ["Television", "Radio"]}, "946ba46308": {"question": "Which of the following territories is a Crown dependency but is NOT part of the UK?", "reference": "Channel Islands is a British overseas territory linked to the UK, but it is not part of it.", "category": "uk-geography", "answers": ["Northern Ireland", "Wales", "The Channel Islands", "Scotland"], "correct": ["The Channel Islands"]}, "855c873420": {"question": "What did Sir Frank Whittle invent in the 1930s?", "reference": "The jet engine was developed in Britain in the 1930s by Sir Frank Whittle.", "category": "arts-culture-sport", "answers": ["Radar", "Hovercraft", "Jet engine", "Ballpoint pen"], "correct": ["Jet engine"]}, "3511524a7b": {"question": "Who wrote ‘The Daffodils’?", "reference": "The British poet William Wordsworth wrote ‘The Daffodils’.", "category": "arts-culture-sport", "answers": ["William Blake", "Robert Browning", "Lord Byron", "William Wordsworth"], "correct": ["William Wordsworth"]}, "5dab4c398c": {"question": "Who was given the title of Lord Protector?", "reference": "Oliver Cromwell was given the title of Lord Protector and ruled until his death in 1658.", "category": "history", "answers": ["Charles I", "Charles II", "Winston Churchill", "Oliver Cromwell"], "correct": ["Oliver Cromwell"]}, "beda0ee3da": {"question": "What are the 40 days before Easter called?", "reference": "The 40 days before Easter are known as Lent.", "category": "religion-traditions", "answers": ["Diwali", "Lent", "Hannukah", "Vaisakhi"], "correct": ["Lent"]}, "9ea1e57b61": {"question": "What is the Home Secretary responsible for?", "reference": "Chancellor of the Exchequer – responsible for the economy Home Secretary – responsible for crime, policing and immigration Foreign Secretary – responsible for managing relationships with foreign countries other ministers (called ‘Secretaries of State’) responsible for subjects such as education, health and defence.", "category": "government-law", "answers": ["Health", "Defence", "Education", "Policing"], "correct": ["Policing"]}, "16e471a482": {"question": "St Helena is a British overseas territory and it is part of the United Kingdom.", "reference": "There are also several islands which are closely linked with the UK but are not part of it: the Channel Islands and the Isle of Man. These have their own governments and are called ‘Crown dependencies’. There are also several British overseas territories in other parts of the world, such as St Helena and the Falkland", "category": "uk-geography", "answers": ["True", "False"], "correct": ["False"]}, "bb266ae045": {"question": "Several Church of England bishops sit in the House of Lords.", "reference": "This statement is true.", "category": "government-law", "answers": ["True", "False"], "correct": ["True"]}, "19ac2302fd": {"question": "When walking your dog in a public place, you must ensure:", "reference": "All dogs in public places must wear a collar showing the name and address of the owner.", "category": "government-law", "answers": ["That your dog does not play with other dogs", "That your dog wears a collar showing the name and address of the owner", "That your dog wears a high visibility jacket", "That your dog does not bark"], "correct": ["That your dog wears a collar showing the name and address of the owner"]}, "ea337da29f": {"question": "Women over the age of 30 were given the right to vote as a result of their contribution towards the war effort. Which war was that?", "reference": "In 1918, women over the age of 30 were given voting rights and the right to stand for Parliament, partly in recognition of the contribution women made to the war effort during the First World War.", "category": "history", "answers": ["The Second World War", "The Crimean War", "The First World War", "The Civil War"], "correct": ["The First World War"]}, "dc2cae103d": {"question": "When did Ireland become a republic?", "reference": "In 1921 a peace treaty was signed and in 1922 Ireland became two countries. The six counties in the north which were mainly Protestant remained part of the UK under the name Northern Ireland. The rest of Ireland became the Irish Free State. It had its own government and became a republic in 1949.", "category": "history", "answers": ["1925", "1939", "1949", "1927"], "correct": ["1949"]}, "c2bc5fc147": {"question": "Where did the first farmers come from?", "reference": "The first farmers arrived in Britain 6,000 years ago. The ancestors of these first farmers probably came from south-east Europe.", "category": "history", "answers": ["South-west Europe", "South-east Europe", "North-east America", "North-west Asia"], "correct": ["South-east Europe"]}, "998f23fd12": {"question": "Who was an important contributor to the ‘pop art’ movement of the 1960’s?", "reference": "David Hockney was an important contributor to the ‘pop art’ movement of the 1960s and continues to be influential today.", "category": "arts-culture-sport", "answers": ["David Hockney", "Lucian Freud", "John Petts", "Henry Moore"], "correct": ["David Hockney"]}, "4b091edf0b": {"question": "Who became Prime Minister and was an inspirational leader to the British people during WWII?", "reference": "Winston Churchill.", "category": "history", "answers": ["Winston Churchill", "Clement Attlee", "Margaret Thatcher", "Sir Robert Walpole"], "correct": ["Winston Churchill"]}, "b82058bc73": {"question": "Who led the first invasion of Britain?", "reference": "Julius Caesar led a Roman invasion of Britain in 55 BC. This was unsuccessful and for nearly 100 years Britain remained separate from the Roman Empire. In AD 43 the Emperor Claudius led the Roman army in a new invasion. This time, there was resistance from some of the British tribes but the Romans were successful in occupying almost all of Britain.", "category": "history", "answers": ["Emperor Hadrian", "Julius Caesar", "Canute", "William, the Duke of Normandy"], "correct": ["Julius Caesar"]}, "6e7233ab65": {"question": "Under which king did the Anglo-Saxon kingdoms in England unite to defeat the Vikings?", "reference": "The Anglo-Saxon kingdoms in England united under King Alfred the Great, who defeated the Vikings.", "category": "history", "answers": ["William of Orange", "King Alfred the Great", "Henry VIII", "Robert the Bruce"], "correct": ["King Alfred the Great"]}, "1de62470f2": {"question": "When was the Magna Carta created?", "reference": "The Magna Carta was created in 1215.", "category": "history", "answers": ["1514", "1215", "1415", "1314"], "correct": ["1215"]}, "660acff39a": {"question": "Northern Ireland has its own banknotes, which are valid everywhere in the UK.", "reference": "This statement is true.", "category": "uk-geography", "answers": ["True", "False"], "correct": ["True"]}, "fed5211fa6": {"question": "Which of the following plays was written by William Shakespeare?", "reference": "William Shakespeare’s most famous plays include A Midsummer Night’s dream.", "category": "arts-culture-sport", "answers": ["Pride and Prejudice", "A Midsummer Night’s dream", "Sense and Sensibility", "Great Expectations"], "correct": ["A Midsummer Night’s dream"]}, "cda040dca9": {"question": "How many members does a jury have in England, Wales and Northern Ireland?", "reference": "In England, Wales and Northern Ireland a jury has 12 members.", "category": "government-law", "answers": ["9", "12", "15", "20"], "correct": ["12"]}, "59073932ef": {"question": "Which two of the following religious communities celebrate Diwali?", "reference": "Diwali is celebrated by Hindus and Sikhs.", "category": "religion-traditions", "answers": ["Buddhists", "Hindus", "Jews", "Sikhs"], "correct": ["Hindus", "Sikhs"]}, "3f63216960": {"question": "What is Good Friday?", "reference": "Good Friday marks the death of Jesus Christ during the Easter.", "category": "religion-traditions", "answers": ["The day when Jesus Christ rose from the dead", "The day when Jesus Christ was born", "The day when Jesus Christ died", "The day when Jesus Christ became 30 years old"], "correct": ["The day when Jesus Christ died"]}, "f26a108d7d": {"question": "St Patrick’s day is a public holiday in Northern Ireland.", "reference": "True. Only Scotland and Northern Ireland have their patron saint’s day as an official holiday (although in Scotland not all businesses and offices will close).", "category": "religion-traditions", "answers": ["True", "False"], "correct": ["True"]}, "68c5604ff9": {"question": "Which was the last successful foreign invasion of England that took place in 1066?", "reference": "The Norman Conquest was the last successful foreign invasion of England in 1066.", "category": "history", "answers": ["The Viking invasion", "The Anglo-Saxon Conquest", "The Roman invasion", "The Norman Conquest"], "correct": ["The Norman Conquest"]}, "c4bc295024": {"question": "Where are the Crown Jewels kept?", "reference": "The Crown Jewels are kept at the Tower of London.", "category": "uk-geography", "answers": ["At the House of Commons", "At the Tower of London", "At Buckingham Palace", "At Windsor Castle"], "correct": ["At the Tower of London"]}, "3d41b39dcd": {"question": "Which sport can be traced back to the 15th century in Scotland?", "reference": "The modern game of golf can be traced back to 15th century Scotland.", "category": "arts-culture-sport", "answers": ["Golf", "Tennis", "Football", "Rugby"], "correct": ["Golf"]}, "ea0ada26ac": {"question": "Who was the first person in England to print books using a printing press?", "reference": "William Caxton was the first person in England to print books using a printing press.", "category": "history", "answers": ["William Shakespeare", "John Barbour", "Geoffrey Chaucer", "William Caxton"], "correct": ["William Caxton"]}, "9299f2b34e": {"question": "Which court deals with minor criminal cases in England, Wales and Northern Ireland?", "reference": "In England, Wales and Northern Ireland, most minor criminal cases are dealt with in a Magistrates’ Court. In Scotland, minor criminal offences go to a Justice of the Peace Court.", "category": "government-law", "answers": ["High Court", "Justice of the Peace Court", "Magistrates’ Court", "Crown Court"], "correct": ["Magistrates’ Court"]}, "8b0a5d2979": {"question": "What did the Scottish John Logie Baird develop?", "reference": "The television was developed by Scotsman John Logie Baird in the 1920s.", "category": "arts-culture-sport", "answers": ["Television", "Radar", "Personal computer", "Radio"], "correct": ["Television"]}, "64c494442e": {"question": "Which of the following is a fundamental principle of British life?", "reference": "The fundamental principles of British life include: Democracy The rule of law Individual liberty Tolerance of those with different faiths and beliefs Participation in community life.", "category": "values-principles", "answers": ["Communism", "Intolerance", "Individual liberty", "Inequity"], "correct": ["Individual liberty"]}, "9a8008fac6": {"question": "Wales has its own established church.", "reference": "Churches in the UK: Inside a Catholic Church There is no established Church in Wales or Northern Ireland. Other Protestant Christian groups in the UK are Baptists, Methodists, Presbyterians and Quakers. There are also other denominations of Christianity, the biggest of which is Roman Catholic.", "category": "religion-traditions", "answers": ["True", "False"], "correct": ["False"]}, "67b4e99ac9": {"question": "How is New Year’s Eve called in Scotland?", "reference": "In Scotland, the 31st of December (New Year’s Eve) is called Hogmanay.", "category": "religion-traditions", "answers": ["Vaisakhi", "Hannukah", "Diwali", "Hogmanay"], "correct": ["Hogmanay"]}, "7d5c2c675d": {"question": "Why did Henry VIII establish the church of England?", "reference": "To divorce his first wife, Henry needed the approval of the Pope. When the Pope refused, Henry established the church of England.", "category": "history", "answers": ["To celebrate his wedding with Anne of Cleves", "To have control over religious people", "To establish a unique religion in England", "To divorce his first wife, Catherine of Aragon"], "correct": ["To divorce his first wife, Catherine of Aragon"]}, "773ee4c045": {"question": "What is the name of the long war that English kings fought with France in the middle ages?", "reference": "English kings fought a long war with France, called the Hundred Years War (even though it actually lasted 116 years).", "category": "history", "answers": ["The Crimean War", "The First World War", "The Hundred Years War", "The Boer War"], "correct": ["The Hundred Years War"]}, "fdb6425d2b": {"question": "Who was supported by clansmen from the Scottish highlands and raised and army in 1745?", "reference": "In 1745 there was another attempt to put a Stuart king back on the throne in place of George I’s son, George II. Charles Edward Stuart (Bonnie Prince Charlie), the grandson of James II, landed in Scotland. He was supported by clansmen from the Scottish highlands and raised and army.", "category": "history", "answers": ["Bonnie Prince Charlie", "Robert Burns", "Oliver Cromwell", "Kenneth MacAlpin"], "correct": ["Bonnie Prince Charlie"]}, "7d3adf437d": {"question": "If you think someone is trying to persuade you to join an extremist or terrorist activity, who should you contact?", "reference": "If you think someone is trying to persuade you to join an extremist or terrorist cause, you should notify your local police force.", "category": "government-law", "answers": ["The Home Office", "Your local police force", "Your local MP", "Your family"], "correct": ["Your local police force"]}, "75038e9010": {"question": "It is compulsory for 16 and 17-year-olds to join the National Citizen Service programme.", "reference": "False. The National Citizen Service programme, which gives 16- and 17-year-olds the opportunity to enjoy outdoor activities, develop their skills and take part in a community project. Therefore, it is optional.", "category": "government-law", "answers": ["True", "False"], "correct": ["False"]}, "33c29b75cf": {"question": "What is the name of the tour guides that tell visitors stories about the Tower of London’s history?", "reference": "Tours are given at the Tower of London by the Yeoman Warders, also known as Beefeaters, who tell visitors about the building’s history.", "category": "uk-geography", "answers": ["Knights", "Chartists", "Suffragettes", "Beefeaters"], "correct": ["Beefeaters"]}, "786b71d625": {"question": "Which two countries developed the Concorde, the world’s only supersonic commercial airliner?", "reference": "Britain and France developed the world’s only supersonic commercial airliner, Concorde.", "category": "history", "answers": ["Italy", "Britain", "Germany", "France"], "correct": ["Britain", "France"]}, "f407c911a8": {"question": "Where is Snowdonia located?", "reference": "Snowdonia is in Wales.", "category": "uk-geography", "answers": ["Scotland", "Wales", "England", "Northern Ireland"], "correct": ["Wales"]}, "14b3ce4178": {"question": "Who wrote Sherlock Holmes?", "reference": "Sir Arthur Conan Doyle is the author of Sherlock Holmes.", "category": "arts-culture-sport", "answers": ["Evelyn Waugh", "Sir Kingsley Amis", "Graham Greene", "Sir Arthur Conan Doyle"], "correct": ["Sir Arthur Conan Doyle"]}, "9684e19617": {"question": "Which country was invaded by Germany in 1939?", "reference": "Germany invaded Poland in 1939.", "category": "history", "answers": ["Austria", "Italy", "Russia", "Poland"], "correct": ["Poland"]}, "ba7ec25b64": {"question": "Who is the patron Saint of Wales?", "reference": "The patron Saint of Wales is St David.", "category": "religion-traditions", "answers": ["St David", "St George", "St Patrick", "St Andrew"], "correct": ["St David"]}, "c935b9431f": {"question": "Lake District is the largest national park of England.", "reference": "This statement is true.", "category": "uk-geography", "answers": ["True", "False"], "correct": ["True"]}, "05e081abf3": {"question": "What is the name of the area in London where famous theatres are located?", "reference": "London’s west end, also known as ‘Theatreland’, is particularly well known for its theatres.", "category": "uk-geography", "answers": ["Soho", "Theatreland", "Westminster", "Hyde Park"], "correct": ["Theatreland"]}, "c352d846c7": {"question": "Which two of the following are key roles of school governors?", "reference": "Governors and school boards have an important part to play in raising school standards. They have three key roles: setting the strategic direction of the school, ensuring accountability and monitoring and evaluating school performance.", "category": "government-law", "answers": ["Monitoring student's behaviour", "Monitoring and evaluating school performance", "Setting the strategic direction of the school", "Giving awards to the best students of the school"], "correct": ["Monitoring and evaluating school performance", "Setting the strategic direction of the school"]}, "4896649e93": {"question": "What led the American colonies to want their independence from Britain?", "reference": "The British government wanted to tax the colonies.", "category": "history", "answers": ["The British government wanted to control their borders", "They were running out of resources", "The British government wanted to tax them", "There were not enough jobs for the local people"], "correct": ["The British government wanted to tax them"]}, "9166c23d6a": {"question": "When did the Black Death take place?", "reference": "In 1348 (Middle Ages) the Black Death came to Britain.", "category": "history", "answers": ["The Golden Age", "The Stone Age", "The Middle Ages", "The Iron Age"], "correct": ["The Middle Ages"]}, "5a82f8dd76": {"question": "Who was the leader of the suffragettes, the group that campaigned for women’s rights to vote?", "reference": "Emmeline Pankhurst was the leader of the suffragettes.", "category": "history", "answers": ["Queen Victoria", "Oliver Cromwell", "Florence Nightingale", "Emmeline Pankhurst"], "correct": ["Emmeline Pankhurst"]}, "e71c755173": {"question": "Cardiff is the capital city of which country?", "reference": "The capital city of Wales is Cardiff.", "category": "uk-geography", "answers": ["Scotland", "Northern Ireland", "Ireland", "Wales"], "correct": ["Wales"]}, "77d06ca5ca": {"question": "During the Great Depression in the 1930s which industry was badly affected?", "reference": "During the ‘Great Depression’ in the 1930s the traditional heavy industries such as shipbuilding were badly affected.", "category": "history", "answers": ["Housing construction", "Shipbuilding", "Automobile", "Aviation"], "correct": ["Shipbuilding"]}, "0519cff84d": {"question": "Who was the first man in the world to run 1 mile in under 4 minutes?", "reference": "Sir Roger Bannister was the first man in the world to run a mile in under four minutes, in 1954.", "category": "arts-culture-sport", "answers": ["Sir Chris Hoy", "Sir Roger Bannister", "David Weir", "Mo Farah"], "correct": ["Sir Roger Bannister"]}, "d09d465dc3": {"question": "Which festival celebrates the end of Ramadan, when Muslims have fasted for a month?", "reference": "Eid al-Fitr celebrates the end of Ramadan, when Muslims have fasted for a month.", "category": "religion-traditions", "answers": ["Hannukah", "Vaisakhi", "Eid ul Adha", "Eid al-Fitr"], "correct": ["Eid al-Fitr"]}, "b8b113fe8b": {"question": "What was the last battle between Great Britain and France?", "reference": "In 1815, the French Wars ended with the defeat of the Emperor Napoleon by the Duke of Wellington at the Battle of Waterloo.", "category": "history", "answers": ["The Battle of Trafalgar", "The Battle of Waterloo", "The Battle of Hastings", "Battle of Agincourt"], "correct": ["The Battle of Waterloo"]}, "96f6467466": {"question": "Which flower is associated with Wales?", "reference": "The flower associated with Wales is the daffodil.", "category": "uk-geography", "answers": ["Daffodil", "Rose", "Shamrock", "Thistle"], "correct": ["Daffodil"]}, "1c204eb734": {"question": "During the reign of Charles II parts of London were destroyed, what was the cause of this destruction?", "reference": "During Charles II’s reign, a great fire destroyed much of the city, including many churches and St Paul’s Cathedral.", "category": "history", "answers": ["A war", "A flood", "A fire", "An earthquake"], "correct": ["A fire"]}, "a5707402ef": {"question": "How often are general elections held in the UK?", "reference": "MPs are elected at a General Election, which is held at least every five years.", "category": "government-law", "answers": ["Every 3 years", "Every 4 years", "Every 5 years", "Every 10 years"], "correct": ["Every 5 years"]}, "12bb9a1bd2": {"question": "Scotland has its own banknotes, which are valid everywhere in the UK.", "reference": "Northern Ireland and Scotland have their own banknotes, which are valid everywhere in the UK. However, shops and businesses do not have to accept them.", "category": "uk-geography", "answers": ["True", "False"], "correct": ["True"]}, "bfdc02f8a1": {"question": "What charity works to preserve important buildings, coastline and countryside in the UK?", "reference": "The National Trust is a charity that works to preserve important buildings, coastline and countryside in the UK.", "category": "government-law", "answers": ["Shelter", "Age UK", "Crisis", "The National Trust"], "correct": ["The National Trust"]}, "babb4be44e": {"question": "Great Britain refers only to England, Wales and Scotland.", "reference": "This statement is true.", "category": "uk-geography", "answers": ["True", "False"], "correct": ["True"]}, "b6174d7c7f": {"question": "Who was the tribal leader who terbury on a pilgrimage. This collection of poems is called The Canterbury Tales.", "category": "history", "answers": ["Poems", "Novels", "Jokes", "Fables"], "correct": ["Poems"]}, "6847615a09": {"question": "When is Christmas Day?", "reference": "Christmas Day is celebrated on the 25th of December.", "category": "religion-traditions", "answers": ["24th of December", "25th of December", "26th of December", "27th of December"], "correct": ["25th of December"]}, "4b7656535f": {"question": "Who supported King Charles I during the Civil War?", "reference": "During the civil war between the king and Parliament the country split into those who supported the king (the Cavaliers) and those who supported Parliament (the Roundheads).", "category": "history", "answers": ["Roundheads", "Suffragettes", "Quakers", "Cavaliers"], "correct": ["Cavaliers"]}, "0526191363": {"question": "What battle is commemorated in the Bayeux Tapestry?", "reference": "The Battle of Hastings is commemorated in a great piece of embroidery, known as the Bayeux tapestry.", "category": "history", "answers": ["The Battle of Waterloo", "The Battle of Trafalgar", "The Battle of Hastings", "The Battle of Britain"], "correct": ["The Battle of Hastings"]}, "1b79b930d4": {"question": "Where was Anne Boleyn, the wife of Henry VIII, executed?", "reference": "Anne Boleyn was unpopular in the country and was accused of taking lovers. She was executed at the Tower of London.", "category": "history", "answers": ["Houses of the Parliament", "Stonehenge", "Tower of London", "Whitehall"], "correct": ["Tower of London"]}, "4993504fdc": {"question": "Racial crime and smoking in public places are examples of:", "reference": "Racial crime and smoking in public places are examples of criminal offences.", "category": "government-law", "answers": ["Civil offences", "Criminal offences"], "correct": ["Criminal offences"]}, "0704d1c711": {"question": "What type of character was played by Charlie Chaplin?", "reference": "Sir Charles (Charlie) Chaplin became famous in silent movies for his tramp character and was one of many British actors to make a career in Hollywood.", "category": "arts-culture-sport", "answers": ["A superhero", "A tramp", "A scientific genius", "A bandit"], "correct": ["A tramp"]}, "b02c43e1c3": {"question": "You have to be at least 21 years old to stand as MP.", "reference": "This statement is false. Anyone aged 18 or over can stand for election as an MP but they are unlikely to win unless they have been nominated to represent one of the major political parties. These are the Conservative Party, the Labour Party, the Liberal Democrats, or one of the parties representing Scottish, Welsh or Northern Irish interests.", "category": "government-law", "answers": ["True", "False"], "correct": ["False"]}, "e11e452d21": {"question": "Who developed the radar?", "reference": "Sir Robert Watson-Watt developed the radar.", "category": "history", "answers": ["John Logie Baird", "Sir Frank Whittle", "Sir Christopher Cockrell", "Sir Robert Watson-Watt"], "correct": ["Sir Robert Watson-Watt"]}, "21898ae9a5": {"question": "Where is the official home of the Prime Minister?", "reference": "The official home of the Prime Minister is 10 Downing Street.", "category": "uk-geography", "answers": ["18 Oxford Street", "Buckingham Palace", "Windsor Castle", "10 Downing Street"], "correct": ["10 Downing Street"]}, "da4bd7d455": {"question": "When does Easter take place?", "reference": "Easter takes place in March or April.", "category": "religion-traditions", "answers": ["November or December", "January or February", "March or April", "May or June"], "correct": ["March or April"]}, "a56d2af86c": {"question": "Which of the following is not a valid UK coin?", "reference": "There are no 25p coins in the UK currency.", "category": "uk-geography", "answers": ["1p", "5p", "25p", "£1"], "correct": ["25p"]}, "7f68d8bdfe": {"question": "Where is the Eden Project located?", "reference": "The Eden Project is located in Cornwall, in the south west of England.", "category": "uk-geography", "answers": ["Dorset", "Cornwall", "Devon", "Somerset"], "correct": ["Cornwall"]}, "6293386425": {"question": "St Helena and the Falkland Islands are part of Great Britain.", "reference": "There are also several British overseas territories in other parts of the world, such as St Helena and the Falkland Islands. They are also linked to the UK but are not part of it.", "category": "uk-geography", "answers": ["True", "False"], "correct": ["False"]}, "6adee54b87": {"question": "Which two of the following are fundamental principles of British life?", "reference": "The fundamental principles of British life include: democracy, the rule of law, individual liberty, tolerance of those with different faiths and beliefs and participation in community life.", "category": "values-principles", "answers": ["Monarchy", "The rule of law", "Democracy", "Join a political party"], "correct": ["The rule of law", "Democracy"]}, "5b5a154765": {"question": "Where should you register if you want to become part of a jury?", "reference": "People on the electoral register are randomly selected to serve on a jury. Therefore, if you want to be selected to form part of a jury you have to be on the electoral register and be between 18 to 70 years old.", "category": "government-law", "answers": ["The electoral register", "Your local church", "The NHS", "The British Embassy"], "correct": ["The electoral register"]}, "c62bbef7e1": {"question": "What sort of church is the Church of Scotland?", "reference": "In Scotland, the national Church is the Church of Scotland, which is a Presbyterian Church.", "category": "religion-traditions", "answers": ["Catholic", "Baptist", "Presbyterian", "Methodist"], "correct": ["Presbyterian"]}, "3c0d82d64c": {"question": "Where does golf come from?", "reference": "The modern game of golf can be traced back to 15th century Scotland.", "category": "uk-geography", "answers": ["Wales", "Australia", "Ireland", "Scotland"], "correct": ["Scotland"]}, "1c9e55568d": {"question": "When do the television and newspapers have stories that are jokes until midday?", "reference": "On April Fool’s Day, the 1st of April the television and newspapers often have stories that are April Fool jokes.", "category": "religion-traditions", "answers": ["Valentine’s Day", "Boxing Day", "Halloween", "April Fool’s Day"], "correct": ["April Fool’s Day"]}, "f6f23c6689": {"question": "What king was defeated by Oliver Cromwell during the Civil War and hid in an oak tree before escaping to Europe?", "reference": "The correct answer is Charles II.", "category": "history", "answers": ["Richard III", "Charles II", "James I", "Henry IV"], "correct": ["Charles II"]}, "7d5741f035": {"question": "Who was the father of Queen Elizabeth I?", "reference": "The father of Queen Elizabeth I was Henry VIII.", "category": "history", "answers": ["Edward I", "Henry V", "Henry VII", "Henry VIII"], "correct": ["Henry VIII"]}, "cda2e58bfb": {"question": "Complaints against the police can only be made by writing to the Police Complaints Commissioner.", "reference": "Anyone can make a complaint about the police by going to a police station and writing to the Chief Constable of the police force involved. Complaints can also be made to an independent body: the Independent Police Complaints Commission in England and Wales, the Police Complaints Commissioner for Scotland or the Police Ombudsman for Northern Ireland.", "category": "government-law", "answers": ["True", "False"], "correct": ["False"]}, "ec98287bc2": {"question": "Who is the patron Saint of Northern Ireland?", "reference": "The patron Saint of Northern Ireland is St Patrick.", "category": "religion-traditions", "answers": ["St George", "St Patrick", "St Andrew", "St David"], "correct": ["St Patrick"]}, "128a077d08": {"question": "What is the name of the period when new ideas about politics, philosophy and science were developed?", "reference": "During the 18th century, new ideas about politics, philosophy and science were developed. This is often called ‘the Enlightenment’.", "category": "history", "answers": ["The Enlightenment", "The Glorious Revolution", "The Swinging Sixties", "The Reformation"], "correct": ["The Enlightenment"]}, "264dfdd98b": {"question": "Which of the following statements is TRUE:", "reference": "Mary Stuart (‘Mary, Queen of Scots’) was a Catholic.", "category": "history", "answers": ["Mary Stuart (‘Mary, Queen of Scots’) was a Protestant", "Mary Stuart (‘Mary, Queen of Scots’) was a Catholic"], "correct": ["Mary Stuart (‘Mary, Queen of Scots’) was a Catholic"]}, "582c4bb4c6": {"question": "Which of the following is an example of civil law?", "reference": "Discrimination in the workplace is an example of civil law.", "category": "government-law", "answers": ["To sell tobacco products to anyone under the age of 18", "To buy alcohol for people who are under the age of 18", "Discrimination in the workplace", "To carry a weapon of any kind, even if it is for self-defence"], "correct": ["Discrimination in the workplace"]}, "c0ba7429b1": {"question": "In which battle did Admiral Nelson die?", "reference": "Admiral Nelson was in charge of the British fleet at the Battle of Trafalgar and was killed in the battle.", "category": "history", "answers": ["The Battle of Hastings", "The Battle of Waterloo", "The Battle of Trafalgar", "The Battle of Bannockburn"], "correct": ["The Battle of Trafalgar"]}, "9f7c58954d": {"question": "William of Orange was asked by Protestants to invade England and proclaim himself king. But, when William reached England, there was no resistance and he took over the throne. This event was later Known as:", "reference": "William of Orange was asked by Protestants to invade England and proclaim himself king. When William reached England, there was no resistance and he took over the throne. This event was later called the ‘Glorious Revolution’.", "category": "history", "answers": ["The 'Glorious Revolution'", "The Restoration", "The 'Great Depression'", "The 'Blitz'"], "correct": ["The 'Glorious Revolution'"]}, "51b5953ec7": {"question": "What sort of charity is ‘Friends of the Earth’?", "reference": "Friends of the Earth is an environmental charity.", "category": "government-law", "answers": ["An environmental charity", "A medical research charity", "A charity working with pets", "A charity working with older people"], "correct": ["An environmental charity"]}, "9c53652728": {"question": "If a husband forces his wife to have sex he can be charged with rape.", "reference": "This statement is true.", "category": "government-law", "answers": ["True", "False"], "correct": ["True"]}, "a3312c02d2": {"question": "In which country of the British Empire did the Boer War (1899-1902) take place?", "reference": "The Boer War of 1899 to 1902 took place in South Africa with settlers from the Netherlands called the Boers.", "category": "history", "answers": ["Netherlands", "Falkland Islands", "Gibraltar", "South Africa"], "correct": ["South Africa"]}, "285e890890": {"question": "Which of the following actions is known as “canvassing”?", "reference": "Members of political parties persuade people to vote for their candidates – for instance, by handing out leaflets in the street or by knocking on people’s doors and asking for their support. This is called ‘canvassing’.", "category": "government-law", "answers": ["Donating blood to help people", "Volunteering for an environmental charity", "Caring for animals at a local rescue shelter", "Persuading people to vote for a political party"], "correct": ["Persuading people to vote for a political party"]}, "3386e110f7": {"question": "Which novel written by JRR Tolkien was voted the country’s best-loved novel in 2003?", "reference": "In 2003, the Lord of the Rings by JRR Tolkien was voted the country’s best-loved novel.", "category": "arts-culture-sport", "answers": ["Oliver Twist", "James Bond", "Pride and Pre rmations of columns made from volcanic lava", "Areas of protected countryside", "Medieval buildings"], "correct": ["Areas of protected countryside"]}, "9c3720f873": {"question": "Northern Ireland has its own established church.", "reference": "False. There is no established Church in Wales or Northern Ireland.", "category": "religion-traditions", "answers": ["True", "False"], "correct": ["False"]}, "532623698a": {"question": "Which three territories form Great Britain?", "reference": "‘Great Britain’ refers only to England, Scotland and Wales, not to Northern Ireland.", "category": "uk-geography", "answers": ["Wales", "Northern Ireland", "England", "Scotland"], "correct": ["Wales", "England", "Scotland"]}, "a22bd8a504": {"question": "How often are ‘Prime Minister’s Questions’ held in the parliament?", "reference": "Prime Minister’s Questions takes place every week while Parliament is sitting.", "category": "government-law", "answers": ["Every day", "Every week", "Every two weeks", "Once a month"], "correct": ["Every week"]}, "ebd80ae594": {"question": "Which king was executed in 1649?", "reference": "The correct answer is Charles I.", "category": "history", "answers": ["James I", "Charles II", "James VII", "Charles I"], "correct": ["Charles I"]}, "513af1ab60": {"question": "Where was William Shakespeare born?", "reference": "Shakespeare was born in Stratford-upon-Avon, England.", "category": "arts-culture-sport", "answers": ["Manchester", "Oldham", "Stratford-upon-Avon", "Lincolnshire"], "correct": ["Stratford-upon-Avon"]}, "4f74bfb29f": {"question": "Which two of the following are famous British Paralympians?", "reference": "Baroness Tanni Grey-Thompson and Ellie Simmonds are the correct answers.", "category": "arts-culture-sport", "answers": ["Dame Kelly Holmes", "Baroness Tanni Grey-Thompson", "Jayne Torvill", "Ellie Simmonds"], "correct": ["Baroness Tanni Grey-Thompson", "Ellie Simmonds"]}, "a60b707e29": {"question": "Who was reigning in England when English set een Party", "The Labour Party", "The Liberal Democrats Party"], "correct": ["The Conservative Party", "The Liberal Democrats Party"]}, "12cf16d114": {"question": "Who established the Church of England?", "reference": "The correct answer is Henry VIII.", "category": "history", "answers": ["Henry VIII", "Oliver Cromwell", "Winston Churchill", "William of Orange"], "correct": ["Henry VIII"]}, "f0c33b5352": {"question": "In 1348, one third of the population in England, Wales and Scotland died as a result of which disease?", "reference": "In 1348, a disease, probably a form of plague, came to Britain. This was known as the Black Death. One third of the population of England died and a similar proportion in Scotland and Wales.", "category": "history", "answers": ["Measles", "Leprosy", "Smallpox", "The Black Death"], "correct": ["The Black Death"]}, "b940baef72": {"question": "Haggis is a traditional food from which area?", "reference": "Haggis is a traditional food from Scotland.", "category": "religion-traditions", "answers": ["Wales", "England", "Northern Ireland", "Scotland"], "correct": ["Scotland"]}, "9231556052": {"question": "Which court deals with minor criminal offences in Scotland?", "reference": "In Scotland, minor criminal offences go to a Justice of the Peace Court.", "category": "government-law", "answers": ["The Sheriff Court", "The Magistrates' Court", "The Crown Court", "The Justice of the Peace Court"], "correct": ["The Justice of the Peace Court"]}, "19f7190bf6": {"question": "Which two of the following records give us information about England during the reign of William I?", "reference": "The Domesday Book and the Bayeux Tapestry.", "category": "history", "answers": ["The Magna Carta", "The Domesday Book", "The Bayeux Tapestry", "The Canterbury Tales"], "correct": ["The Domesday Book", "The Bayeux Tapestry"]}, "2e9aac6a13": {"question": "In 1913, the British government promised ‘Home Rule’ for Ireland, why were changes in Ireland delayed until 1921?", ct and obey the law", "Vote in all elections", "Take part in religious activities", "Look after the area in which you live and the environment"], "correct": ["Respect and obey the law", "Look after the area in which you live and the environment"]}, "2ee4354ab5": {"question": "When is Halloween celebrated?", "reference": "Halloween is celebrated on the 31st of October.", "category": "religion-traditions", "answers": ["5th of November", "11th of November", "31st of October", "1st of April"], "correct": ["31st of October"]}, "f2437d9d48": {"question": "The Bill of Rights in 1689 gave women the right to vote.", "reference": "False. The Bill of Rights, 1689, confirmed the rights of Parliament and the limits of the king’s power.", "category": "history", "answers": ["True", "False"], "correct": ["False"]}, "f1e6ddce9d": {"question": "What is the name of the most famous cricket competition played between England and Australia?", "reference": "The most famous cricket competition is the Ashes, which is a series of Test matches played between England and Australia.", "category": "arts-culture-sport", "answers": ["The Ashes", "The Six Nations Championship", "The Grand National", "The Australian Open"], "correct": ["The Ashes"]}, "f373c71cd2": {"question": "What was the biggest source of employment during the 18th century?", "reference": "During the 18th century, manufacturing jobs became the main source of employment in Britain.", "category": "history", "answers": ["Fishing", "Teaching", "Aircraft industry", "Manufacturing"], "correct": ["Manufacturing"]}, "38f3b77252": {"question": "In 1314 the Scottish, led by Robert the Bruce, defeated the English at the battle of Bannockburn, and Scotland remained unconquered by the English.", "reference": "This statement is true.", "category": "history", "answers": ["True", "False"], "correct": ["True"]}, "84c50b0d90": {"question": "Which of the following is an example of criminal offence?", "reference": "Smoking in public places. It is against the law to smoke tobacco products in nearly every enclosed public place in the UK. There are signs displayed to tell you where you cannot smoke.", "category": "government-law", "answers": ["Smoking in public places where it is not allowed", "Disputes about faulty goods or services", "Disputes about an unfair dismissal in the workplace", "A dispute between the landlord and the tenants who have not paid the rent"], "correct": ["Smoking in public places where it is not allowed"]}, "e37791817d": {"question": "Which Scottish clan was killed for not taking the oath?", "reference": "The MacDonalds of Glencoe.", "category": "history", "answers": ["The MacLaine of Lochbuie", "The McDowalls of Garthland", "The Macpherson of Cluny", "The MacDonalds of Glencoe"], "correct": ["The MacDonalds of Glencoe"]}, "6cdbdf80e3": {"question": "Which two issues can the devolved administrations pass laws on?", "reference": "Policy and laws governing defence, foreign affairs, immigration, taxation and social security all remain under central UK government control. However, many other public services, such as health and education, are controlled by the devolved administrations.", "category": "government-law", "answers": ["Defence", "Social security", "Health", "Education"], "correct": ["Health", "Education"]}, "e03587ab1c": {"question": "The assassination of the Archduke Franz Ferdinand of Austria in 1914 led to which of the following wars?", "reference": "On 28 June 1914, Archduke Franz Ferdinand of Austria was assassinated. This set off a chain of events leading to the First World War (1914-18).", "category": "history", "answers": ["The Crimean War", "The First World War", "The Civil War", "The Second World War"], "correct": ["The First World War"]}, "23d02e8227": {"question": "What is the capital city of Scotland?", "reference": "The capital city of Scotland is Edinburgh.", "category": "uk-geography", "answers": ["Glasgow", "St Andrews", "Edinburgh", "Aberdeen"], "correct": ["Edinburgh"]}, "47acbe6534": {"question": "In 1833 the Emancipation Act abolished slavery throughout the British Empire.", "reference": "This statement is true.", "category": "history", "answers": ["True", "False"], "correct": ["True"]}, "73055655bb": {"question": "What is the name of the process by which many Scottish landlords destroyed individual small farms (known as ‘crofts’) to make space for large flocks of sheep and cattle?", "reference": "A process began which became known as the ‘Highland Clearances’. Many Scottish landlords destroyed individual small farms (known as ‘crofts’) to make space for large flocks of sheep and cattle.", "category": "history", "answers": ["The Black Death", "The Corn Removal", "The Highland Clearances", "The Enlightenment"], "correct": ["The Highland Clearances"]}, "b3981bcb47": {"question": "The Falkland Islands are a British overseas territory and are part of the United Kingdom.", "reference": "The Falkland Islands are a British overseas territory. They are also linked to the UK but are not part of it.", "category": "uk-geography", "answers": ["True", "False"], "correct": ["False"]}, "44a9895211": {"question": "Which two of the following are Civil War Battles?", "reference": "The Battles of Marston Moor and Naseby.", "category": "history", "answers": ["The Battle of Waterloo", "The Battle of Marston Moor", "The Battle of Naseby", "The Battle of Agincourt"], "correct": ["The Battle of Marston Moor", "The Battle of Naseby"]}, "fce93313a2": {"question": "What was the name of the activist group who fought for the women’s right to vote?", "reference": "In the late 19th and early 20th centuries, an increasing number of women campaigned and demonstrated for greater rights and, in particular, the right to vote. They formed the women’s suffrage movement and became known as the ‘suffragettes’.", "category": "history", "answers": ["Chartists", "Beefeaters", "Suffragettes", "Quakers"], "correct": ["Suffragettes"]}, "5b64811134": {"question": "What UK landmark was voted as Britain’s favourite view in 2007?", "reference": "In 2007, television viewers voted Wastwater (Lake District) as Britain’s favourite view.", "category": "uk-geography", "answers": ["The Big Ben", "Lake District", "Snowdonia", "The London Eye"], "correct": ["Lake District"]}, "2832d83c0a": {"question": "Who were the first people to live in Britain in what we call the Stone Age?", "reference": "The first people to live in Britain were hunter-gatherers.", "category": "history", "answers": ["Farmers", "Peasants", "Hunter-gatherers", "Pirates"], "correct": ["Hunter-gatherers"]}, "9a241376e8": {"question": "What is the name of the movement against the authority of the Pope and the ideas of the Catholic Church that took place during the reign of Henry VIII?", "reference": "The correct answer is the Reformation.", "category": "history", "answers": ["The Reformation", "The Enlightenment", "The Glorious Revolution", "The Renaissance"], "correct": ["The Reformation"]}, "3ce232fcfd": {"question": "What do you need to do to apply for a National Insurance Number?", "reference": "If you have permission to work in the UK, you will need to telephone the Department for Work and Pensions (DWP) to arrange to get a National Insurance number.", "category": "government-law", "answers": ["Contact the NHS", "Contact the Department for Work and Pensions (DWP)", "Contact your local MP", "Ask you employer to get it for you"], "correct": ["Contact the Department for Work and Pensions (DWP)"]}, "d795c607dc": {"question": "Which of the following is a major horse-racing event in England?", "reference": "Famous horse-racing events include: Royal Ascot , a five-day race meeting in Berkshire attended by members of the Royal Family; the Grand National at Aintree near Liverpool; and the Scottish Grand National at Ayr.", "category": "arts-culture-sport", "answers": ["The Wimbledon Championship", "Royal Ascot", "The Open Championship", "The Six Nations Championship"], "correct": ["Royal Ascot"]}, "0167b3da70": {"question": "How many members form a jury in Scotland?", "reference": "In Scotland a jury has 15 members.", "category": "government-law", "answers": ["12", "14", "15", "20"], "correct": ["15"]}, "b43c4e2bf8": {"question": "What is known as Lent?", "reference": "The 40 days before Easter are known as Lent.", "category": "religion-traditions", "answers": ["The 40 days before Christmas", "The 40 days after Easter", "The 40 days before Easter", "The 40 days after Christmas"], "correct": ["The 40 days before Easter"]}, "74fd317266": {"question": "When was the last successful foreign invasion of England?", "reference": "The Norman Conquest was the last successful foreign invasion of England in 1066.", "category": "history", "answers": ["1415", "1314", "1066", "1200"], "correct": ["1066"]}, "a7072434b8": {"question": "World War II started as a result of Germany invading which country?", "reference": "The Second World War started when Hitler invaded Poland in 1939. Britain and France declared war in order to stop his aggression.", "category": "history", "answers": ["France", "Russia", "Poland", "Austria"], "correct": ["Poland"]}, "1f859be961": {"question": "Which flower is associated with Scotland?", "reference": "The flower associated with Scotland is the thistle.", "category": "uk-geography", "answers": ["The Shamrock", "The Rose", "The Daffodil", "The Thistle"], "correct": ["The Thistle"]}, "237f0e501d": {"question": "Police complaints can only be made by writing to the Chief Constable of the police force involved.", "reference": "Anyone can make a complaint about the police by going to a police station and writing to the Chief Constable of the police force involved. Complaints can also be made to an independent body: the Independent Police Complaints Commission in England and Wales, the Police Complaints Commissioner for Scotland or the Police Ombudsman for Northern Ireland.", "category": "government-law", "answers": ["True", "False"], "correct": ["False"]}, "e10823f4e6": {"question": "Which of the following is a responsibility of the Home Secretary?", "reference": "The Home Secretary is responsible for crime, policing and immigration.", "category": "government-law", "answers": ["Economy", "Crime", "Education", "Defence"], "correct": ["Crime"]}, "fd26e1ecfb": {"question": "When is St David’s day celebrated?", "reference": "St David’s day, patron of Wales, is celebrated on the 1st of March.", "category": "religion-traditions", "answers": ["1st March", "17th March", "23rd April", "17th April"], "correct": ["1st March"]}, "650722f980": {"question": "What happened to ‘Mary, Queen of Scots’ after she spent 20 years in prison?", "reference": "Mary was eventually executed, accused of plotting against Elizabeth I.", "category": "history", "answers": ["She became Queen of England", "She was sent to France", "She escaped to Denmark", "She was executed"], "correct": ["She was executed"]}, "1ca4add683": {"question": "What did Francis Crick discover?", "reference": "Francis Crick discovered the structure of the DNA molecule.", "category": "arts-culture-sport", "answers": ["The MRI (magnetic resonance imaging) scanner", "The jet engine", "The IVF (in-vitro fertilisation) therapy", "The structure of the DNA molecule"], "correct": ["The structure of the DNA molecule"]}, "dd0025edc1": {"question": "Northern Ireland and Scotland have their own banknotes, which are valid everywhere in the UK.", "reference": "This statement is true.", "category": "uk-geography", "answers": ["True", "False"], "correct": ["True"]}, "b92fdf233a": {"question": "How many national parks are there in England, Wales and Scotland?", "reference": "There are 15 national parks in England, Wales and Scotland.", "category": "uk-geography", "answers": ["25", "15", "18", "42"], "correct": ["15"]}, "9c4b35ee98": {"question": "Is Northern Ireland part of Great Britain?", "reference": "‘Great Britain’ refers only to England, Scotland and Wales, not to Northern Ireland.", "category": "uk-geography", "answers": ["Yes", "No"], "correct": ["No"]}, "1281d8a5da": {"question": "If you are a dog owner, which two things should your dog’s collar have when you go out for a walk?", "reference": "All dogs in public places must wear a collar showing the name and address of the owner.", "category": "government-law", "answers": ["The owner's address", "The owner's name", "The dog's breed", "The dog's name"], "correct": ["The owner's address", "The owner's name"]}, "d06b2a88ec": {"question": "What day relates to the death of Jesus Christ?", "reference": "Easter takes place in March or April. It marks the death of Jesus Christ on Good Friday and his rising from the dead on Easter Sunday.", "category": "religion-traditions", "answers": ["Good Friday", "Easter Sunday", "Easter Monday", "Ash Wednesday"], "correct": ["Good Friday"]}, "9ee5a78797": {"question": "A responsibility of the MPs is to represent everyone in their _______.", "reference": "A responsibility of the MPs is to represent everyone in their constituency.", "category": "government-law", "answers": ["County", "Estate", "District", "Constituency"], "correct": ["Constituency"]}, "ce18d23e4e": {"question": "What was achieved with the Magna Carta?", "reference": "The Magna Carta established the idea that even the king was subject to the law. It protected the rights of the nobility and restricted the king’s power to collect taxes or to make and change laws. In future, the king would need to involve his noblemen in decisions.", "category": "history", "answers": ["It restricted the King's power", "It increased the King's power", "It restricted the rights of the farmers", "It increased women's power"], "correct": ["It restricted the King's power"]}, "55915e8621": {"question": "Female genital mutilation (FGM) or taking a girl or woman abroad for FGM is illegal in the UK and it is a criminal offence.", "reference": "This statement is true.", "category": "government-law", "answers": ["True", "False"], "correct": ["True"]}, "1987033a2e": {"question": "What year were women given the right to vote?", "reference": "In 1918, women over the age of 30 were given voting rights and the right to stand for Parliament, partly in recognition of the contribution women made to the war effort during the First World War.", "category": "history", "answers": ["1918", "1925", "1949", "1914"], "correct": ["1918"]}, "1577463d10": {"question": "Which two of the following are British overseas territories?", "reference": "There are several British overseas territories, such as St Helena and the Falkland Islands. They are linked to the UK but are not part of it.", "category": "uk-geography", "answers": ["St Helena", "Solomon Islands", "Mauritius", "The Falkland Islands"], "correct": ["St Helena", "The Falkland Islands"]}, "8a99b9d161": {"question": "Who did the English defeat in 1588?", "reference": "In 1588 the English defeated the Spanish Armada (a large fleet of ships).", "category": "history", "answers": ["The Normands", "The Romans", "The Spanish Armada", "The Saxons"], "correct": ["The Spanish Armada"]}, "bf9cce3287": {"question": "Who designed the Cenotaph?", "reference": "Sir Edwin Lutyens was responsible for designing many war memorials throughout the world, including the Cenotaph in Whitehall.", "category": "history", "answers": ["Sir Norman Foster", "Lancelot ‘Capability’ Brown", "Sir Edwin Lutyens", "Isambard Kingdom Brunel"], "correct": ["Sir Edwin Lutyens"]}, "aa6b1ec198": {"question": "How often are the members of the Welsh government elected?", "reference": "There are 60 members of the Welsh government or members of the Senedd (MSs) and elections are held every four years using a form of proportional representation.", "category": "government-law", "answers": ["Every 5 years", "Every 2 years", "Every 4 years", "Every 3 years"], "correct": ["Every 4 years"]}, "7df0c3defa": {"question": "During which period did the Beatles become popular and social laws were liberalised?", "reference": "The decade of the 1960s was a period of significant social change. It was known as the ‘swinging sixties’. There was growth in British fashion, cinema and popular music. Two well-known pop music groups at the time were The Beatles and The Rolling Stones. It was also a time when social laws were liberalised, for example in relation to divorce and to abortion in England, Wales and Scotland. The position of women in the workplace also improved.", "category": "history", "answers": ["1960s", "1970s", "1980s", "1950s"], "correct": ["1960s"]}, "575bc82ff7": {"question": "The Man Booker Prize is awarded in which of the following categories?", "reference": "The Man Booker Prize for Fiction is awarded annually for the best fiction novel (literature) written by an author from the Commonwealth, Ireland or Zimbabwe. It has been awarded since 1968. Past winners include Ian McEwan, Hilary Mantel and Julian Barnes.", "category": "arts-culture-sport", "answers": ["Films", "Sport", "Literature", "Music"], "correct": ["Literature"]}, "7f7321400c": {"question": "What sort of election takes place when a member of the Parliament (MP) dies or resigns?", "reference": "If an MP dies or resigns, there will be a fresh election, called a by-election, in his or her constituency.", "category": "government-law", "answers": ["Coalition", "Pre-selection", "Random selection", "By-election"], "correct": ["By-election"]}, "4c24ef529b": {"question": "What is the Turner Prize?", "reference": "The Turner Prize was established in 1984 and celebrates contemporary art. The Turner Prize is recognised as one of the most prestigious visual art awards in Europe.", "category": "arts-culture-sport", "answers": ["A literature award", "A music award", "A contemporary art award", "A theatre award"], "correct": ["A contemporary art award"]}, "05d02f397e": {"question": "Which flower is associated with Northern Ireland?", "reference": "The flower associated with Northern Ireland is the shamrock.", "category": "uk-geography", "answers": ["The daffodil", "The thistle", "The shamrock", "The rose"], "correct": ["The shamrock"]}, "3aa0ca8867": {"question": "The last battle between Britain and France was the battle of Waterloo.", "reference": "This statement is true.", "category": "history", "answers": ["True", "False"], "correct": ["True"]}, "f1b494e585": {"question": "£100 is the highest value note in circulation in the UK.", "reference": "This statement is false.", "category": "uk-geography", "answers": ["True", "False"], "correct": ["False"]}, "4d07e98a2d": {"question": "Where is the Lake District National Park located?", "reference": "Lake District is in England.", "category": "uk-geography", "answers": ["Scotland", "Wales", "England", "Northern Ireland"], "correct": ["England"]}, "0f24fe8271": {"question": "Which two responsibilities will you have as a British citizen?", "reference": "If you wish to be a permanent resident or citizen of the UK, you should: respect and obey the law, look after yourself and your family, respect the rights of others, including their right to their own opinions, treat others with fairness and look after the area in which you live and the environment.", "category": "values-principles", "answers": ["To buy food locally", "To volunteer in a community project at least once a year", "To look after yourself and your family", "To respect the rights of others, including their right to their own opinions"], "correct": ["To look after yourself and your family", "To respect the rights of others, including their right to their own opinions"]}, "3ed9239c1b": {"question": "Who was born in Stratford-upon-Avon?", "reference": "William Shakespeare was born in Stratford-upon-Avon, England.", "category": "arts-culture-sport", "answers": ["Jane Austen", "Charles Dickens", "William Shakespeare", "Thomas Hardy"], "correct": ["William Shakespeare"]}, "0a794dafd4": {"question": "Why is 1928 an important year in women’s voting history?", "ref
