n government policies", "To debate important national issues", "To appoint the government"], "correct": ["To advise, warn and encourage the Prime Minister\\'s decisions on government policies", "To appoint the government"]}, "d1de4f5a21": {"question": "What kind of disaster was the Black Death?", "reference": "The Black Death was a disease, probably a form of plague, that came to Britain in 1348.", "category": "history", "answers": ["A plague", "A big fire", "A famine", "A drought"], "correct": ["A plague"]}, "01cdd4eef8": {"question": "What country was in conflict with the UK for trading reasons during the 18th century?", "reference": "During the 18th century, trading and settlements overseas sometimes brought Britain into conflict with other countries, particularly France, which was expanding and trading in a similar way in many of the same areas of the world.", "category": "history", "answers": ["Andorra", "Germany", "France", "Luxembourg"], "correct": ["France"]}, "cea8e65936": {"question": "The Speaker is an MP, he or she represents a constituency and deals with the constituents.", "reference": "This statement is true.", "category": "government-law", "answers": ["True", "False"], "correct": ["True"]}, "54c335b749": {"question": "Where is Skara Brae, the best preserved prehistoric village in northern Europe, located?", "reference": "Skara Brae on Orkney, off the north coast of Scotland, is the best preserved prehistoric village in northern Europe.", "category": "uk-geography", "answers": ["Scotland", "Wales", "England", "Northern Ireland"], "correct": ["Scotland"]}, "453eb3a9b1": {"question": "Where was William the Conqueror from?", "reference": "William the Conqueror was the Duke of Normandy (now northern France). He defeated Harold, the Saxon king of England, at the Battle of Hastings in 1066.", "category": "history", "answers": ["Italy", "Portugal", "France", "Ireland"], "correct": ["France"]}, "6a9ee544e6": {"question": "How do you call the British who went to war in South Africa with settlers from the Netherlands?", "reference": "The British went to war in South Africa with settlers from the Netherlands called the Boers. The Boers fought fiercely and the war went on for over three years.", "category": "history", "answers": ["Blacksmiths", "Boers", "Conquistadors", "Beefeaters"], "correct": ["Boers"]}, "2dfaeaa350": {"question": "In Northern Ireland, up to three specially trained magistrates or a District Judge are required for Youth Court cases.", "reference": "This statement is true.", "category": "government-law", "answers": ["True", "False"], "correct": ["True"]}, "30983d0f1c": {"question": "What made Roger Banister famous?", "reference": "Sir Roger Bannister was the first man in the world to run a mile in under four minutes, in 1954.", "category": "arts-culture-sport", "answers": ["He was the first man in the world to run a mile in under four minutes.", "He won gold medals for ice dancing at the Olympic Games in 1984.", "He won gold medals in rowing in five consecutive Olympic Games.", "He was the first British to climb Mount Everest."], "correct": ["He was the first man in the world to run a mile in under four minutes."]}, "44bf8d09f3": {"question": "Who was invated to invade and rule England in 1688?", "reference": "In 1688, important Protestants in England asked William of Orange to invade England and proclaim himself king.", "category": "history", "answers": ["The Duke of Medina Sidonia", "Napoleon", "King Philip II of Spain", "William of Orange"], "correct": ["William of Orange"]}, "5b9fa0968d": {"question": "Who was defeated at the Battle of the Boyne?", "reference": "William of Orange defeated James II at the Battle of the Boyne in Ireland in 1690.", "category": "history", "answers": ["James I", "James II", "Richard I", "Richard II"], "correct": ["James II"]}, "7d9c4cb582": {"question": "What did the Factories Act of 1847 introduce?", "reference": "The Factories Act of 1847 limited the number of hours that orrect": ["Clone a mammal, Dolly the sheep."]}, "d080a83481": {"question": "What is the correct order of the Patron Saints' Days?", "reference": "", "category": "religion-traditions", "answers": ["St Patrick's Day, St David's Day, St George's Day, St Andrew's Day", "St David's Day, St Patrick's Day, St George's Day, St Andrew's Day", "St Andrew's Day, St Patrick's Day, St David's Day, St George's Day", "St George's Day, St Patrick's Day, St David's Day, St Andrew's Day"], "correct": ["St David's Day, St Patrick's Day, St George's Day, St Andrew's Day"]}, "2592e27502": {"question": "Which British TV programme is popular in the UK?", "reference": "", "category": "arts-culture-sport", "answers": ["The Crown", "Line of Duty", "Coronation Street", "EastEnders"], "correct": ["Coronation Street", "EastEnders"]}, "244a78e82e": {"question": "Under whose reign when 13 North American Colonies claim independence?", "reference": "", "category": "history", "answers": ["George III", "Elizebeth I", "Victoria", "George II"], "correct": ["George III"]}, "900f38e91d": {"question": "is the Scottish Parliament (MSPs), elected by a form of proportional representation?", "reference": "", "category": "government-law", "answers": ["yes", "no"], "correct": ["yes"]}}}</script>
<script>
(function () {
    'use strict';

    // ===================== theme (mirrors app.js / index.html) =====================
    var THEME_KEY = 'liuk_theme';
    var themeBtn = document.getElementById('theme-toggle');
    function systemPrefersDark() { return !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches); }
    function getStoredTheme() { try { return localStorage.getItem(THEME_KEY); } catch (e) { return null; } }
    function setStoredTheme(t) { try { localStorage.setItem(THEME_KEY, t); } catch (e) {} }
    function effectiveTheme() { return getStoredTheme() || (systemPrefersDark() ? 'dark' : 'light'); }
    function applyTheme(theme) {
        if (theme) document.documentElement.setAttribute('data-theme', theme);
        else document.documentElement.removeAttribute('data-theme');
        themeBtn.textContent = effectiveTheme() === 'dark' ? '☀️' : '🌙';
        readPalette();
        scheduleDraw();
    }
    themeBtn.onclick = function () {
        var next = effectiveTheme() === 'dark' ? 'light' : 'dark';
        setStoredTheme(next);
        applyTheme(next);
    };
    if (window.matchMedia) {
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function () {
            if (!getStoredTheme()) applyTheme(null);
        });
    }

    // ===================== data =====================
    var DATA = JSON.parse(document.getElementById('graph-data').textContent);
    var CATEGORY_LABELS = {
        'values-principles': 'Values, Principles & Being a Citizen',
        'uk-geography': 'The UK: Geography, Nations & Symbols',
        'history': 'British History',
        'government-law': 'Government, Law & Civic Life',
        'religion-traditions': 'Religion, Customs & Traditions',
        'arts-culture-sport': 'Arts, Culture, Sport & Science',
        'uncategorized': 'Uncategorized'
    };
    var TYPE_LABELS = { person: 'Person', place: 'Place', event: 'Event / period', organization: 'Organization', work: 'Work / document', group: 'People / group' };
    var TYPE_ORDER = ['person', 'place', 'event', 'organization', 'work', 'group'];

    // Seeded on a large circle (± jitter), not scattered uniformly at
    // random: a uniform scatter has a real chance of placing two of 340
    // nodes only a few px apart, and this sim's repulsion (~70000/d^2)
    // turns that into a single explosive displacement on tick 1 - which
    // then makes the settled layout's shape chaotically sensitive to the
    // random seed (verified empirically - see scratchpad notes). A circle
    // keeps every pair's starting distance bounded below.
    var nodesById = {};
    DATA.nodes.forEach(function (n, i) {
        var ang = (i / DATA.nodes.length) * Math.PI * 2;
        var rad = 300 + Math.random() * 50;
        n.x = Math.cos(ang) * rad;
        n.y = Math.sin(ang) * rad;
        n.vx = 0; n.vy = 0;
        n.r = Math.max(4, Math.min(30, 4 + Math.sqrt(n.count) * 3.4));
        nodesById[n.id] = n;
    });
    // adjacency (id -> [{id, weight}]), sorted strongest-first
    var adjacency = {};
    DATA.nodes.forEach(function (n) { adjacency[n.id] = []; });
    DATA.edges.forEach(function (e) {
        e.s = nodesById[e.source];
        e.t = nodesById[e.target];
        adjacency[e.source].push({ id: e.target, weight: e.weight, questions: e.questions });
        adjacency[e.target].push({ id: e.source, weight: e.weight, questions: e.questions });
    });
    Object.keys(adjacency).forEach(function (id) { adjacency[id].sort(function (a, b) { return b.weight - a.weight; }); });

    var typeCounts = {};
    TYPE_ORDER.forEach(function (t) { typeCounts[t] = 0; });
    DATA.nodes.forEach(function (n) { typeCounts[n.type] = (typeCounts[n.type] || 0) + 1; });

    document.getElementById('topbar-stats').textContent =
        DATA.nodes.length + ' entities · ' + DATA.edges.length + ' links · ' + Object.keys(DATA.questions).length + ' questions';

    // ===================== palette (read from CSS custom properties, so it follows the theme toggle) =====================
    var PALETTE = {};
    function readPalette() {
        var cs = getComputedStyle(document.documentElement);
        TYPE_ORDER.forEach(function (t) { PALETTE[t] = cs.getPropertyValue('--type-' + t).trim(); });
        PALETTE.edge = cs.getPropertyValue('--edge-color').trim();
        PALETTE.text = cs.getPropertyValue('--text-color').trim();
        PALETTE.muted = cs.getPropertyValue('--text-muted').trim();
        PALETTE.canvasBg = cs.getPropertyValue('--canvas-bg').trim();
        PALETTE.selected = cs.getPropertyValue('--primary-color').trim();
    }
    readPalette();

    // ===================== filter state =====================
    var activeTypes = {};
    TYPE_ORDER.forEach(function (t) { activeTypes[t] = true; });
    var minMentions = 1;

    function nodeVisible(n) { return activeTypes[n.type] && n.count >= minMentions; }

    // ===================== legend =====================
    var legendEl = document.getElementById('legend');
    TYPE_ORDER.forEach(function (t) {
        var row = document.createElement('label');
        row.className = 'legend-row';
        row.innerHTML =
            '<input type="checkbox" checked data-type="' + t + '">' +
            '<span class="legend-swatch" style="background:var(--type-' + t + ')"></span>' +
            '<span class="legend-label">' + TYPE_LABELS[t] + '</span>' +
            '<span class="legend-count">' + typeCounts[t] + '</span>';
        legendEl.appendChild(row);
        row.querySelector('input').addEventListener('change', function (e) {
            activeTypes[t] = e.target.checked;
            fitToScreen();
        });
    });

    var minSlider = document.getElementById('min-mentions');
    var minVal = document.getElementById('min-mentions-val');
    minSlider.addEventListener('input', function () {
        minMentions = parseInt(minSlider.value, 10);
        minVal.textContent = minMentions;
        fitToScreen();
    });

    // ===================== mobile sidebar toggle =====================
    var sidebar = document.getElementById('sidebar');
    document.getElementById('sidebar-toggle-btn').addEventListener('click', function () { sidebar.classList.add('open'); });
    document.getElementById('sidebar-close-btn').addEventListener('click', function () { sidebar.classList.remove('open'); });

    // ===================== force simulation =====================
    var W = 0, H = 0;
    var canvas = document.getElementById('graph-canvas');
    var ctx = canvas.getContext('2d');
    var pane = document.querySelector('.graph-pane');

    function resize() {
        var rect = pane.getBoundingClientRect();
        W = rect.width; H = rect.height;
        var dpr = window.devicePixelRatio || 1;
        canvas.width = W * dpr;
        canvas.height = H * dpr;
        canvas.style.width = W + 'px';
        canvas.style.height = H + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        scheduleDraw();
    }
    window.addEventListener('resize', resize);

    var REPULSION = 70000;
    var REPULSION_MAX_D = 650; // beyond this, repulsion is negligible anyway - skipping it is just a speedup, EXCEPT it also caps how far a node with nothing pulling it back (see GRAVITY) can be shoved before force drops to exactly zero
    var LINK_DIST = 90;
    var LINK_STRENGTH = 0.02;
    var GRAVITY = 0.006; // weak uniform pull toward the origin - keeps edge-less nodes (no spring to anchor them) from drifting off into the void under residual repulsion, and rounds the overall shape out; too weak to disturb the repulsion/spring equilibrium of the connected core (see rigid recentering below for why a *strong* version of this force is a bug, not a feature)
    var MAX_SPEED = 30; // per-tick velocity clamp - without it, two nodes that happen to start (or end up) a couple of px apart get a single explosive repulsion kick that flings them out at wildly different speeds tick to tick, which is what made the settled layout's shape chaotically sensitive to the random seed (verified empirically - see scratchpad notes)
    var DAMPING = 0.85;
    var alpha = 1, ALPHA_DECAY = 0.994, ALPHA_MIN = 0.01;
    var settled = false;

    function simTick() {
        var nodes = DATA.nodes;
        var n = nodes.length;
        var fx = new Float64Array(n), fy = new Float64Array(n);

        for (var i = 0; i < n; i++) {
            var a = nodes[i];
            for (var j = i + 1; j < n; j++) {
                var b = nodes[j];
                var dx = b.x - a.x, dy = b.y - a.y;
                var d2 = dx * dx + dy * dy || 0.01;
                if (d2 > REPULSION_MAX_D * REPULSION_MAX_D) continue;
                var d = Math.sqrt(d2);
                var minD = a.r + b.r + 6;
                var force = REPULSION / d2;
                if (d < minD) force += (minD - d) * 0.6; // extra collision push
                var fxi = (dx / d) * force, fyi = (dy / d) * force;
                fx[i] -= fxi; fy[i] -= fyi;
                fx[j] += fxi; fy[j] += fyi;
            }
            fx[i] -= a.x * GRAVITY;
            fy[i] -= a.y * GRAVITY;
        }

        DATA.edges.forEach(function (e) {
            var s = e.s, t = e.t;
            var dx = t.x - s.x, dy = t.y - s.y;
            var d = Math.sqrt(dx * dx + dy * dy) || 0.01;
            var target = LINK_DIST + 40 / Math.sqrt(e.weight);
            var diff = (d - target) * LINK_STRENGTH;
            var ux = dx / d, uy = dy / d;
            var si = s.__i, ti = t.__i;
            fx[si] += ux * diff; fy[si] += uy * diff;
            fx[ti] -= ux * diff; fy[ti] -= uy * diff;
        });

        var cx = 0, cy = 0;
        for (var k = 0; k < n; k++) {
            var node = nodes[k];
            if (!node.__fixed) {
                var nvx = (node.vx + fx[k] * alpha) * DAMPING;
                var nvy = (node.vy + fy[k] * alpha) * DAMPING;
                var speed = Math.sqrt(nvx * nvx + nvy * nvy);
                if (speed > MAX_SPEED) { nvx = nvx / speed * MAX_SPEED; nvy = nvy / speed * MAX_SPEED; }
                node.vx = nvx; node.vy = nvy;
                node.x += node.vx;
                node.y += node.vy;
            }
            cx += node.x; cy += node.y;
        }
        // Recenter the whole layout by translating every node by the same
        // amount (the centroid's offset from the origin) rather than
        // pulling each node toward the origin individually - a per-node
        // spring-to-center force fights repulsion at long range (repulsion
        // decays with 1/d^2, a spring force grows with d) and collapses
        // the whole graph inward as the layout spreads out. A rigid
        // translation adds no net force between nodes, so it can't do that.
        cx /= n; cy /= n;
        for (var m = 0; m < n; m++) { nodes[m].x -= cx; nodes[m].y -= cy; }
        alpha *= ALPHA_DECAY;
    }
    DATA.nodes.forEach(function (n, i) { n.__i = i; });

    var simRunning = true;
    function simLoop() {
        if (!simRunning) return;
        for (var s = 0; s < 2; s++) simTick();
        if (alpha < ALPHA_MIN) { simRunning = false; settled = true; fitToScreen(); }
        draw();
        if (simRunning) requestAnimationFrame(simLoop);
    }

    // ===================== camera (pan/zoom) =====================
    var cam = { x: 0, y: 0, k: 1 };
    function worldToScreen(x, y) { return [x * cam.k + cam.x, y * cam.k + cam.y]; }
    function screenToWorld(x, y) { return [(x - cam.x) / cam.k, (y - cam.y) / cam.k]; }

    function fitToScreen() {
        if (!DATA.nodes.length) return;
        var minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
        DATA.nodes.forEach(function (n) {
            if (!nodeVisible(n)) return;
            minX = Math.min(minX, n.x - n.r); maxX = Math.max(maxX, n.x + n.r);
            minY = Math.min(minY, n.y - n.r); maxY = Math.max(maxY, n.y + n.r);
        });
        if (!isFinite(minX)) return;
        var w = maxX - minX, h = maxY - minY;
        var pad = 60;
        var k = Math.min((W - pad) / w, (H - pad) / h, 2.2);
        cam.k = k;
        cam.x = W / 2 - (minX + w / 2) * k;
        cam.y = H / 2 - (minY + h / 2) * k;
        scheduleDraw();
    }
    document.getElementById('zoom-reset').addEventListener('click', fitToScreen);
    document.getElementById('zoom-in').addEventListener('click', function () { zoomBy(1.3, W / 2, H / 2); });
    document.getElementById('zoom-out').addEventListener('click', function () { zoomBy(1 / 1.3, W / 2, H / 2); });
    function zoomBy(factor, sx, sy) {
        var wx = (sx - cam.x) / cam.k, wy = (sy - cam.y) / cam.k;
        cam.k = Math.max(0.05, Math.min(6, cam.k * factor));
        cam.x = sx - wx * cam.k;
        cam.y = sy - wy * cam.k;
        scheduleDraw();
    }

    canvas.addEventListener('wheel', function (e) {
        e.preventDefault();
        var rect = canvas.getBoundingClientRect();
        zoomBy(Math.pow(1.0015, -e.deltaY), e.clientX - rect.left, e.clientY - rect.top);
    }, { passive: false });

    // ===================== interaction: drag pan / drag node / click / hover =====================
    var pointer = { down: false, dragNode: null, draggedDist: 0, lastX: 0, lastY: 0 };
    var hoveredNode = null;
    var selectedNode = null;
    var tooltip = document.getElementById('tooltip');

    function nodeAt(sx, sy) {
        var w = screenToWorld(sx, sy);
        var best = null, bestD = Infinity;
        for (var i = 0; i < DATA.nodes.length; i++) {
            var n = DATA.nodes[i];
            if (!nodeVisible(n)) continue;
            var dx = n.x - w[0], dy = n.y - w[1];
            var d = Math.sqrt(dx * dx + dy * dy);
            var hitR = Math.max(n.r, 8 / cam.k);
            if (d <= hitR && d < bestD) { best = n; bestD = d; }
        }
        return best;
    }

    canvas.addEventListener('pointerdown', function (e) {
        canvas.setPointerCapture(e.pointerId);
        var rect = canvas.getBoundingClientRect();
        var sx = e.clientX - rect.left, sy = e.clientY - rect.top;
        pointer.down = true;
        pointer.draggedDist = 0;
        pointer.lastX = sx; pointer.lastY = sy;
        var hit = nodeAt(sx, sy);
        if (hit) {
            pointer.dragNode = hit;
            hit.__fixed = true;
            simRunning = true; alpha = Math.max(alpha, 0.25); requestAnimationFrame(simLoop);
        } else {
            pointer.dragNode = null;
            canvas.classList.add('dragging');
        }
    });

    canvas.addEventListener('pointermove', function (e) {
        var rect = canvas.getBoundingClientRect();
        var sx = e.clientX - rect.left, sy = e.clientY - rect.top;
        if (pointer.down) {
            var ddx = sx - pointer.lastX, ddy = sy - pointer.lastY;
            pointer.draggedDist += Math.abs(ddx) + Math.abs(ddy);
            if (pointer.dragNode) {
                var w = screenToWorld(sx, sy);
                pointer.dragNode.x = w[0]; pointer.dragNode.y = w[1];
                pointer.dragNode.vx = 0; pointer.dragNode.vy = 0;
                scheduleDraw();
            } else {
                cam.x += ddx; cam.y += ddy;
                scheduleDraw();
            }
            pointer.lastX = sx; pointer.lastY = sy;
        } else {
            var hit = nodeAt(sx, sy);
            if (hit !== hoveredNode) {
                hoveredNode = hit;
                canvas.style.cursor = hit ? 'pointer' : 'grab';
                scheduleDraw();
            }
            if (hit) {
                tooltip.style.display = 'block';
                tooltip.style.left = (sx + 14) + 'px';
                tooltip.style.top = (sy + 10) + 'px';
                tooltip.innerHTML = '<div class="tt-label">' + escapeHtml(hit.label) + '</div>' +
                    '<div class="tt-meta">' + TYPE_LABELS[hit.type] + ' · ' + hit.count + ' question' + (hit.count === 1 ? '' : 's') + '</div>';
            } else {
                tooltip.style.display = 'none';
            }
        }
    });

    function endPointer(e) {
        if (pointer.dragNode) {
            pointer.dragNode.__fixed = false;
            if (pointer.draggedDist < 4) selectNode(pointer.dragNode);
        } else if (pointer.draggedDist < 4) {
            var rect = canvas.getBoundingClientRect();
            var hit = nodeAt(e.clientX - rect.left, e.clientY - rect.top);
            selectNode(hit);
        }
        pointer.down = false;
        pointer.dragNode = null;
        canvas.classList.remove('dragging');
    }
    canvas.addEventListener('pointerup', endPointer);
    canvas.addEventListener('pointercancel', endPointer);
    canvas.addEventListener('pointerleave', function () { tooltip.style.display = 'none'; });

    // ===================== drawing =====================
    var drawScheduled = false;
    function scheduleDraw() {
        if (drawScheduled) return;
        drawScheduled = true;
        requestAnimationFrame(function () { drawScheduled = false; draw(); });
    }

    function neighborSet(n) {
        var s = new Set();
        if (!n) return s;
        adjacency[n.id].forEach(function (a) { s.add(a.id); });
        return s;
    }

    function draw() {
        ctx.clearRect(0, 0, W, H);
        ctx.save();
        ctx.translate(cam.x, cam.y);
        ctx.scale(cam.k, cam.k);

        var focus = selectedNode || hoveredNode;
        var focusNeighbors = focus ? neighborSet(focus) : null;

        // edges
        ctx.lineCap = 'round';
        DATA.edges.forEach(function (e) {
            if (!nodeVisible(e.s) || !nodeVisible(e.t)) return;
            var involved = focus && (e.source === focus.id || e.target === focus.id);
            var dim = focus && !involved;
            var alphaE = dim ? 0.05 : (focus ? 0.7 : Math.min(0.35, 0.08 + e.weight * 0.03));
            ctx.strokeStyle = 'rgba(' + PALETTE.edge + ',' + alphaE + ')';
            ctx.lineWidth = (involved ? 1.6 : 0.7) / cam.k;
            ctx.beginPath();
            ctx.moveTo(e.s.x, e.s.y);
            ctx.lineTo(e.t.x, e.t.y);
            ctx.stroke();
        });

        // nodes
        var showLabelZoom = cam.k > 0.9;
        DATA.nodes.forEach(function (n) {
            if (!nodeVisible(n)) return;
            var dim = focus && n !== focus && !(focusNeighbors && focusNeighbors.has(n.id));
            ctx.globalAlpha = dim ? 0.25 : 1;
            ctx.beginPath();
            ctx.arc(n.x, n.y, n.r, 0, Math.PI * 2);
            ctx.fillStyle = PALETTE[n.type];
            ctx.fill();
            if (n === selectedNode) {
                ctx.lineWidth = 2.5 / cam.k;
                ctx.strokeStyle = PALETTE.selected;
                ctx.stroke();
            } else if (n === hoveredNode) {
                ctx.lineWidth = 1.5 / cam.k;
                ctx.strokeStyle = PALETTE.text;
                ctx.stroke();
            }

            var showLabel = !dim && (n.count >= 5 || showLabelZoom || n === selectedNode || n === hoveredNode);
            if (showLabel) {
                var fontSize = Math.max(9, Math.min(13, n.r + 4)) / cam.k;
                ctx.font = (n === selectedNode ? '700 ' : '500 ') + fontSize + 'px -apple-system, sans-serif';
                ctx.fillStyle = PALETTE.text;
                ctx.textBaseline = 'middle';
                ctx.textAlign = 'left';
                ctx.fillText(n.label, n.x + n.r + 4 / cam.k, n.y);
            }
            ctx.globalAlpha = 1;
        });

        ctx.restore();
    }

    // ===================== search =====================
    var searchInput = document.getElementById('search-input');
    var searchResults = document.getElementById('search-results');
    searchInput.addEventListener('input', function () {
        var q = searchInput.value.trim().toLowerCase();
        searchResults.innerHTML = '';
        if (!q) return;
        var matches = DATA.nodes.filter(function (n) { return n.label.toLowerCase().indexOf(q) !== -1; })
            .sort(function (a, b) { return b.count - a.count; }).slice(0, 12);
        matches.forEach(function (n) {
            var row = document.createElement('div');
            row.className = 'search-result';
            row.innerHTML = '<span class="swatch" style="background:' + PALETTE[n.type] + '"></span>' +
                '<span>' + escapeHtml(n.label) + '</span><span class="count">' + n.count + '</span>';
            row.addEventListener('click', function () {
                activeTypes[n.type] = true;
                var cb = legendEl.querySelector('input[data-type="' + n.type + '"]');
                if (cb) cb.checked = true;
                if (n.count < minMentions) { minMentions = 1; minSlider.value = 1; minVal.textContent = '1'; }
                selectNode(n);
                centerOn(n);
                searchResults.innerHTML = '';
                searchInput.value = n.label;
            });
            searchResults.appendChild(row);
        });
    });
    document.addEventListener('click', function (e) {
        if (!e.target.closest('.search-wrap')) searchResults.innerHTML = '';
    });

    function centerOn(n) {
        cam.k = Math.max(cam.k, 1.1);
        cam.x = W / 2 - n.x * cam.k;
        cam.y = H / 2 - n.y * cam.k;
        scheduleDraw();
    }

    // ===================== detail panel =====================
    var detailPanel = document.getElementById('detail-panel');

    function escapeHtml(s) {
        return String(s).replace(/[&<>"']/g, function (c) {
            return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
        });
    }

    function highlight(text, term) {
        if (!term) return escapeHtml(text);
        var idx = text.toLowerCase().indexOf(term.toLowerCase());
        if (idx === -1) return escapeHtml(text);
        return escapeHtml(text.slice(0, idx)) + '<mark>' + escapeHtml(text.slice(idx, idx + term.length)) + '</mark>' + escapeHtml(text.slice(idx + term.length));
    }

    function renderEmptyPanel() {
        detailPanel.innerHTML =
            '<div class="panel-empty">' +
            '<p><strong>What is this?</strong> Every person, place, event, organisation and work named anywhere in the Life in the UK question bank (' + Object.keys(DATA.questions).length + ' questions), as a node. Two entities are linked whenever they appear together in the same question - so a king mentioned in one question and again in another surfaces as one node other questions cluster around.</p>' +
            '<p>Node size = how many questions mention it. Click any node to see its linked entities and the actual questions.</p>' +
            '<p style="margin-top:14px;">Common scaffolding terms (UK, Britain, England, Scotland, Wales, Northern Ireland) are deliberately omitted - too ubiquitous to be meaningful nodes.</p>' +
            '</div>';
    }
    renderEmptyPanel();

    function selectNode(n) {
        selectedNode = n || null;
        if (!n) { renderEmptyPanel(); scheduleDraw(); return; }
        if (window.innerWidth <= 760) sidebar.classList.add('open');

        var related = adjacency[n.id];
        var relatedHtml = related.map(function (a) {
            var rn = nodesById[a.id];
            return '<span class="related-chip" data-id="' + rn.id + '">' +
                '<span class="legend-swatch" style="background:' + PALETTE[rn.type] + '"></span>' +
                escapeHtml(rn.label) + '<span class="w">&times;' + a.weight + '</span></span>';
        }).join('');

        var qHtml = n.questions.map(function (uid) {
            var q = DATA.questions[uid];
            return '<div class="qcard">' +
                '<span class="qcat">' + escapeHtml(CATEGORY_LABELS[q.category] || q.category) + '</span>' +
                '<div class="qtext">' + highlight(q.question, n.label) + '</div>' +
                (q.reference ? '<div class="qref">' + highlight(q.reference, n.label) + '</div>' : '') +
                '</div>';
        }).join('');

        detailPanel.innerHTML =
            '<div class="detail-header">' +
            '<div class="detail-type-badge"><span class="legend-swatch" style="background:' + PALETTE[n.type] + '"></span>' + TYPE_LABELS[n.type] + '</div>' +
            '<h3>' + escapeHtml(n.label) + '</h3>' +
            '<div class="detail-count">Mentioned in ' + n.count + ' question' + (n.count === 1 ? '' : 's') + (related.length ? (' · linked to ' + related.length + ' other ' + (related.length === 1 ? 'entity' : 'entities')) : '') + '</div>' +
            '</div>' +
            (related.length ? '<div class="related-chip-wrap">' + relatedHtml + '</div>' : '') +
            '<div class="section-title-row"><h2>Questions</h2></div>' +
            '<div class="question-list">' + qHtml + '</div>';

        detailPanel.querySelectorAll('.related-chip').forEach(function (chip) {
            chip.addEventListener('click', function () {
                var rn = nodesById[chip.getAttribute('data-id')];
                selectNode(rn);
                centerOn(rn);
            });
        });

        scheduleDraw();
    }

    // ===================== boot =====================
    resize();
    requestAnimationFrame(simLoop);
})();
</script>
</body>
</html>
